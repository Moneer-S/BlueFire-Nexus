# gitleaks' own rules, plus the exceptions below. Without useDefault, this file
# would replace the built-in rules with none, and gitleaks could find nothing.
[extend]
useDefault = true

# detect-secrets stores one-way fingerprints of what it accepted, 40 hex
# characters each. Only its "hashed_secret" lines are let through in its
# baseline: any other value in that file is still reported.
[[allowlists]]
description = "detect-secrets fingerprints, not credential values"
condition = "AND"
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''^\s*"hashed_secret": "[0-9a-f]{40}",?\s*$''']

# The exact names below are let through for the rule generic-api-key only, and
# only in the five files that define them. A new finding adds its own exact
# string here, never a wider pattern.
[[allowlists]]
description = "Names of the interface's browser storage keys, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^frontend/src/lib/(ad-smb|assistance|composition|receiver-defense|s3-access)\.ts$''']
regexes = [
  '''^bluefire\.ad-smb\.pending\.v1$''',
  '''^bluefire\.assistance\.receipt\.v1$''',
  '''^bluefire\.composition\.pending\.v1$''',
  '''^bluefire\.composition\.proposals\.v1$''',
  '''^bluefire\.composition\.cancellations\.v1$''',
  '''^bluefire\.receiver-defense\.pending\.v1$''',
  '''^bluefire\.s3\.pending\.v1$''',
  '''^bluefire\.s3\.pending-stops\.v1$''',
]
