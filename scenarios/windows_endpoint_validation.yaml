schema_version: bluefire.scenario.v1
id: scenario.windows.endpoint.validation.v1
title: Windows Endpoint Safe Validation
purpose: Validate the Windows runner action architecture with fixed, harmless system and process discovery plus runner-owned filesystem discovery, deterministic staging, independent observation hints, and complete cleanup.
start: create_fixture
steps:
  - id: create_fixture
    behavior_id: sandbox.fixture.create.v1
    parameters:
      record_count: 10

  - id: discover_system
    behavior_id: endpoint.discovery.system.v1

  - id: discover_processes
    behavior_id: endpoint.discovery.processes.v1
    parameters:
      record_limit: 25

  - id: discover_workspace
    behavior_id: sandbox.discovery.recursive.v1
    parameters:
      record_limit: 35
      max_depth: 3
    inputs:
      workspace:
        from_step: create_fixture
        artifact: workspace

  - id: archive_workspace
    behavior_id: sandbox.archive.tar.v1
    inputs:
      records:
        from_step: discover_workspace
        artifact: records

  - id: transform_fixture
    behavior_id: sandbox.fixture.transform.v1
    parameters:
      redact_values: true
    inputs:
      workspace:
        from_step: create_fixture
        artifact: workspace

  - id: inspect_fixture
    behavior_id: sandbox.discovery.metadata.v1
    alternates:
      - sandbox.discovery.list.v1
    parameters:
      record_limit: 25
    inputs:
      fixture:
        from_step: transform_fixture
        artifact: fixture

  - id: stage_fixture
    behavior_id: sandbox.collection.stage.v1
    parameters:
      bundle_format: json
    inputs:
      records:
        from_step: inspect_fixture
        artifact: records

  - id: cleanup_workspace
    behavior_id: sandbox.cleanup.v1
    parameters:
      verify_removal: true
    inputs:
      workspace:
        from_step: create_fixture
        artifact: workspace

edges:
  - from_step: create_fixture
    outcome: success
    to_step: discover_system
  - from_step: discover_system
    outcome: success
    to_step: discover_processes
  - from_step: discover_processes
    outcome: success
    to_step: discover_workspace
  - from_step: discover_processes
    outcome: partial
    to_step: discover_workspace
  - from_step: discover_workspace
    outcome: success
    to_step: archive_workspace
  - from_step: discover_workspace
    outcome: partial
    to_step: archive_workspace
  - from_step: archive_workspace
    outcome: success
    to_step: transform_fixture
  - from_step: archive_workspace
    outcome: partial
    to_step: transform_fixture
  - from_step: transform_fixture
    outcome: success
    to_step: inspect_fixture
  - from_step: inspect_fixture
    outcome: success
    to_step: stage_fixture
  - from_step: inspect_fixture
    outcome: partial
    to_step: stage_fixture
  - from_step: stage_fixture
    outcome: success
    to_step: cleanup_workspace
  - from_step: stage_fixture
    outcome: partial
    to_step: cleanup_workspace

provenance:
  source: BlueFire Nexus authored validation scenario
  reference: scenario.windows.endpoint.validation.v1
  license: MIT
  derived: false
  notes: Safe action architecture for Windows uses fixed compiled adapters and runner-owned files; restricted persistence families remain metadata-only until separately reviewed.
limitations:
  - Dynamic execution is limited to actions declared safe or controlled by the selected Windows runner profile.
  - Registry, service, scheduled-task, and persistence research modules are structurally represented but are not executed by this scenario.
  - Sysmon and Event Log observation require separately configured collectors and honest readiness reporting.
