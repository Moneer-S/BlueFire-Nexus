schema_version: bluefire.behavior-catalog.v1
items:
  - schema_version: bluefire.behavior.v1
    id: sandbox.fixture.create.v1
    title: Create deterministic fixture
    purpose: Prepare bounded synthetic records in a runner-owned sandbox workspace.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: []
    capabilities: [sandbox.fixture, filesystem.write]
    inputs: []
    outputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
        description: Opaque runner-owned workspace reference.
    parameters:
      - name: record_count
        type: integer
        default: 6
        minimum: 1
        maximum: 100
        description: Number of synthetic records to create.
    simulation_id: simulation.sandbox.fixture.create.v1
    action_ids: [sandbox.fixture.create.v1]
    telemetry: [sandbox.fixture.created]
    detection_hints: [Fixture creation is synthetic and should remain labeled synthetic.]
    provenance: &authored
      source: BlueFire Nexus canonical sandbox design
      reference: canonical neutral behavior catalog
      license: MIT
      derived: false
      notes: New control-plane metadata; no operational implementation is embedded.
    limitations: [Represents only deterministic synthetic fixture data.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.fixture.transform.v1
    title: Transform deterministic fixture
    purpose: Normalize and redact the synthetic fixture inside its sandbox workspace.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: []
    capabilities: [sandbox.fixture, filesystem.read, filesystem.write]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    parameters:
      - name: redact_values
        type: boolean
        default: true
        description: Replace fixture values with deterministic placeholders.
    simulation_id: simulation.sandbox.fixture.transform.v1
    action_ids: [sandbox.fixture.transform.v1]
    telemetry: [sandbox.fixture.transformed]
    detection_hints: [Transformation evidence should include the source artifact hash.]
    provenance: *authored
    limitations: [Only runner-owned fixture artifacts are eligible.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.discovery.list.v1
    title: List fixture records
    purpose: Enumerate record metadata from a typed sandbox fixture artifact.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: [T1083]
    capabilities: [sandbox.discovery, filesystem.read]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: &discovery_parameters
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of fixture records returned.
    simulation_id: simulation.sandbox.discovery.list.v1
    action_ids: [sandbox.discovery.list.v1]
    telemetry: [sandbox.discovery.listed]
    detection_hints: [Record enumeration is confined to the bound fixture artifact.]
    provenance: *authored
    limitations: [Does not enumerate the host filesystem.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.discovery.metadata.v1
    title: Inspect fixture metadata
    purpose: Produce discovery records through a compatible metadata-oriented strategy.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: [T1083]
    capabilities: [sandbox.discovery, filesystem.read]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: *discovery_parameters
    simulation_id: simulation.sandbox.discovery.metadata.v1
    action_ids: [sandbox.discovery.metadata.v1]
    telemetry: [sandbox.discovery.metadata_inspected]
    detection_hints: [Metadata inspection is confined to the bound fixture artifact.]
    provenance: *authored
    limitations: [Compatible alternative to listing; it does not inspect host metadata.]

  - schema_version: bluefire.behavior.v1
    id: endpoint.discovery.system.v1
    title: Discover bounded system identity
    purpose: Observe operating-system and architecture facts through compiled cross-platform APIs.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: [T1082]
    capabilities: [endpoint.discovery, system.discovery]
    inputs: []
    outputs:
      - name: system
        type: artifact.endpoint.system-profile.v1
    parameters: []
    simulation_id: simulation.endpoint.discovery.system.v1
    action_ids: [endpoint.discovery.system.v1]
    telemetry: [endpoint.discovery.system_observed]
    detection_hints: [System discovery is bounded to non-sensitive platform identity fields.]
    provenance: *authored
    limitations: [Does not collect account, network, or host file content.]

  - schema_version: bluefire.behavior.v1
    id: endpoint.discovery.processes.v1
    title: Discover bounded process identities
    purpose: Observe a bounded list of process IDs and names through a fixed platform adapter.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: [T1057]
    capabilities: [endpoint.discovery, process.discovery, process.spawn]
    inputs: []
    outputs:
      - name: processes
        type: artifact.endpoint.process-records.v1
    parameters:
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of process identity records returned.
    simulation_id: simulation.endpoint.discovery.processes.v1
    action_ids: [endpoint.discovery.processes.v1]
    telemetry: [endpoint.discovery.processes_observed]
    detection_hints: [Process discovery uses only a compiled API or fixed reviewed command vector.]
    provenance: *authored
    limitations: [Does not accept an executable or caller-authored arguments.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.discovery.recursive.v1
    title: Recursively discover sandbox files
    purpose: Enumerate files and directories only below a bound runner-owned workspace.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: [T1083]
    capabilities: [sandbox.discovery, filesystem.read]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: records
        type: artifact.sandbox.filesystem.record.v1
        multiple: true
    parameters:
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of filesystem records returned.
      - name: max_depth
        type: integer
        default: 3
        minimum: 1
        maximum: 16
        description: Maximum directory depth traversed below the bound workspace.
    simulation_id: simulation.sandbox.discovery.recursive.v1
    action_ids: [sandbox.discovery.recursive.v1]
    telemetry: [sandbox.discovery.recursive_completed]
    detection_hints: [Recursive enumeration should retain the bound root and truncation signal.]
    provenance: *authored
    limitations: [Symlinks are reported as blocked and are never traversed.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.archive.tar.v1
    title: Create deterministic sandbox archive
    purpose: Stage selected runner-owned files into a bounded deterministic ustar archive.
    execution_state: action
    safety_tier: controlled
    platforms: [windows, linux, macos]
    techniques: [T1560.001]
    capabilities: [sandbox.archive, filesystem.read, filesystem.write]
    inputs:
      - name: records
        type: artifact.sandbox.filesystem.record.v1
        multiple: true
    outputs:
      - name: bundle
        type: artifact.sandbox.archive.v1
    parameters: []
    simulation_id: simulation.sandbox.archive.tar.v1
    action_ids: [sandbox.archive.tar.v1]
    telemetry: [sandbox.archive.created]
    detection_hints: [Archive evidence should link its digest to every selected input record.]
    provenance: *authored
    limitations: [Only regular files inside runner-owned scope can be archived.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.collection.stage.v1
    title: Stage selected fixture records
    purpose: Package typed discovery records inside the runner-owned workspace.
    execution_state: action
    safety_tier: controlled
    platforms: [windows, linux, macos]
    techniques: [T1074.001]
    capabilities: [sandbox.collection, filesystem.read, filesystem.write]
    inputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    outputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    parameters:
      - name: bundle_format
        type: string
        default: jsonl
        enum: [jsonl, json]
        description: Deterministic representation used for the fixture bundle.
    simulation_id: simulation.sandbox.collection.stage.v1
    action_ids: [sandbox.collection.stage.v1]
    telemetry: [sandbox.collection.staged]
    detection_hints: [Staging should link each output hash to its discovery-record parents.]
    provenance: *authored
    limitations: [Accepts only typed synthetic discovery records.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.network.loopback.v1
    title: Exercise loopback transport
    purpose: Send a synthetic bundle only to a runner-enforced loopback sink.
    execution_state: action
    safety_tier: controlled
    platforms: [windows, linux, macos]
    techniques: [T1041]
    capabilities: [sandbox.network, filesystem.read, network.loopback]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.network.receipt.v1
    parameters:
      - name: port
        type: integer
        default: 4317
        minimum: 1024
        maximum: 65535
        description: Loopback sink port selected by the reviewed runner profile.
    simulation_id: simulation.sandbox.network.loopback.v1
    action_ids: [sandbox.network.loopback.v1]
    telemetry: [sandbox.network.loopback_attempted]
    detection_hints: [A policy refusal is control-blocked evidence, not executed evidence.]
    provenance: *authored
    limitations: [The action contract permits loopback scope only.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.export.local.v1
    title: Export bundle to approved local storage
    purpose: Preserve a synthetic bundle locally when the network step is blocked.
    execution_state: action
    safety_tier: controlled
    platforms: [windows, linux, macos]
    techniques: []
    capabilities: [sandbox.export, filesystem.read, filesystem.write, export.local]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.export.receipt.v1
    parameters:
      - name: retention_label
        type: string
        default: ephemeral
        enum: [ephemeral, review]
        description: Policy label, not a filesystem path.
    simulation_id: simulation.sandbox.export.local.v1
    action_ids: [sandbox.export.local.v1]
    telemetry: [sandbox.export.local_completed]
    detection_hints: [Local export evidence should record the policy decision and bundle hash.]
    provenance: *authored
    limitations: [The runner chooses the approved export location; no path is accepted.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.cleanup.v1
    title: Clean runner-owned workspace
    purpose: Remove temporary fixture artifacts and emit a cleanup receipt.
    execution_state: action
    safety_tier: safe
    platforms: [windows, linux, macos]
    techniques: []
    capabilities: [sandbox.cleanup, filesystem.write, cleanup]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.cleanup.receipt.v1
    parameters:
      - name: verify_removal
        type: boolean
        default: true
        description: Ask the runner to verify cleanup within its owned workspace.
    simulation_id: simulation.sandbox.cleanup.v1
    action_ids: [sandbox.cleanup.v1]
    telemetry: [sandbox.cleanup.completed]
    detection_hints: [Cleanup evidence should distinguish requested, completed, and partial states.]
    provenance: *authored
    limitations: [Cannot name or remove paths outside the runner-owned workspace.]

  - schema_version: bluefire.behavior.v1
    id: sandbox.restricted.persistence-marker.v1
    title: Validate persistence detection with a restricted sandbox canary
    purpose: Create one fixed, non-executable marker under the runner-owned restricted directory so operators can exercise restricted-tier approvals, observation, and cleanup without modifying host persistence.
    execution_state: action
    safety_tier: restricted
    platforms: [windows, linux, macos]
    techniques: [T1547]
    capabilities: [sandbox.restricted, filesystem.write]
    inputs: []
    outputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
        description: Opaque runner-owned restricted canary workspace reference.
      - name: marker
        type: artifact.sandbox.restricted-marker.v1
        description: Fixed-path non-executable marker used only for detection validation.
    parameters:
      - name: label
        type: string
        default: persistence_detection_canary
        enum: [persistence_detection_canary, control_validation]
        description: Reviewed semantic label; it never becomes a path, command, or host persistence setting.
    simulation_id: simulation.sandbox.restricted.persistence-marker.v1
    action_ids: [sandbox.restricted.persistence-marker.v1]
    telemetry: [sandbox.restricted.persistence_marker_created]
    detection_hints: [Correlate the fixed marker path with its approval, runner receipt, independent collector evidence, and cleanup outcome.]
    provenance: *authored
    limitations: [Does not create, alter, or test operating-system persistence; it writes only restricted/persistence-marker.json inside the bound runner workspace.]

  - &metadata_research
    schema_version: bluefire.behavior.v1
    id: research.credential.access.v1
    title: Credential-access detection research
    purpose: Describe credential-access observables for hypothesis and fixture design.
    execution_state: metadata_only
    safety_tier: restricted
    platforms: [windows, linux, macos]
    techniques: [T1003]
    capabilities: [research.metadata]
    inputs: []
    outputs:
      - name: hypothesis
        type: artifact.research.hypothesis.v1
    parameters:
      - name: evidence_basis
        type: string
        required: true
        enum: [public_documentation, synthetic_fixture]
    action_ids: []
    telemetry: [research.hypothesis.created]
    detection_hints: [Treat the output as a hypothesis until fixture or observed evidence exists.]
    provenance: &legacy_metadata
      source: BlueFire Nexus existing neutral profile metadata
      reference: src/core/modules/impl/standard_modules.py profile mappings
      license: MIT
      derived: true
      notes: Only tactic mapping and observable concepts were retained; no implementation was copied.
    limitations: [Metadata only; unavailable for execution or simulation dispatch.]

  - <<: *metadata_research
    id: research.persistence.change.v1
    title: Persistence-change detection research
    purpose: Describe persistence-change observables for hypothesis and fixture design.
    techniques: [T1547]

  - <<: *metadata_research
    id: research.lateral.movement.v1
    title: Lateral-movement detection research
    purpose: Describe lateral-movement observables for hypothesis and fixture design.
    techniques: [T1021]

  - <<: *metadata_research
    id: research.defense.evasion.v1
    title: Defense-evasion detection research
    purpose: Describe defense-evasion observables for hypothesis and fixture design.
    techniques: [T1562.001]
