schema_version: bluefire.action-catalog.v1
items:
  - schema_version: bluefire.action.v1
    id: sandbox.fixture.create.v1
    title: Create bounded sandbox fixture
    purpose: Create deterministic fixture data inside a runner-owned workspace.
    safety_tier: safe
    capabilities: [sandbox.fixture, filesystem.write]
    platforms: [windows, linux, macos]
    inputs: []
    outputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
        description: Runner-owned workspace reference.
    parameters:
      - name: record_count
        type: integer
        default: 6
        minimum: 1
        maximum: 100
        description: Number of synthetic records to create.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: &authored
      source: BlueFire Nexus canonical sandbox design
      reference: canonical sandbox action contract
      license: MIT
      derived: false
      notes: Declarative contract only; implementation belongs to the reviewed runner.

  - schema_version: bluefire.action.v1
    id: sandbox.fixture.transform.v1
    title: Transform sandbox fixture
    purpose: Normalize and redact fixture records without leaving the runner workspace.
    safety_tier: safe
    capabilities: [sandbox.fixture, filesystem.read, filesystem.write, process.spawn]
    platforms: [windows, linux, macos]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    parameters:
      - name: redact_values
        type: boolean
        default: true
        description: Replace fixture values with deterministic placeholders.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.discovery.list.v1
    title: List sandbox fixture metadata
    purpose: Enumerate fixture records using the runner-owned artifact reference.
    safety_tier: safe
    capabilities: [sandbox.discovery, filesystem.read]
    platforms: [windows, linux, macos]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: &action_discovery_parameters
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of fixture records returned.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.discovery.metadata.v1
    title: Inspect sandbox fixture metadata
    purpose: Produce the same typed discovery records through a metadata-oriented strategy.
    safety_tier: safe
    capabilities: [sandbox.discovery, filesystem.read]
    platforms: [windows, linux, macos]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: *action_discovery_parameters
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.collection.stage.v1
    title: Stage sandbox records
    purpose: Package selected fixture records within the runner-owned workspace.
    safety_tier: controlled
    capabilities: [sandbox.collection, filesystem.read, filesystem.write]
    platforms: [windows, linux, macos]
    inputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    outputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    parameters:
      - name: bundle_format
        type: string
        default: jsonl
        enum: [jsonl, json]
        description: Deterministic representation used for the fixture bundle.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.network.loopback.v1
    title: Send bundle to loopback sink
    purpose: Exercise an explicitly loopback-only transport boundary.
    safety_tier: controlled
    capabilities: [sandbox.network, filesystem.read, network.loopback]
    platforms: [windows, linux, macos]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.network.receipt.v1
    parameters:
      - name: port
        type: integer
        default: 4317
        minimum: 1024
        maximum: 65535
        description: Loopback sink port selected by the reviewed runner profile.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.export.local.v1
    title: Export bundle locally
    purpose: Preserve a bundle in the approved local export area when transport is blocked.
    safety_tier: controlled
    capabilities: [sandbox.export, filesystem.read, filesystem.write, export.local]
    platforms: [windows, linux, macos]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.export.receipt.v1
    parameters:
      - name: retention_label
        type: string
        default: ephemeral
        enum: [ephemeral, review]
        description: Policy label, not a filesystem path.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.cleanup.v1
    title: Clean sandbox workspace
    purpose: Remove runner-owned temporary artifacts and record the cleanup result.
    safety_tier: safe
    capabilities: [sandbox.cleanup, filesystem.write, cleanup]
    platforms: [windows, linux, macos]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.cleanup.receipt.v1
    parameters:
      - name: verify_removal
        type: boolean
        default: true
        description: Ask the runner to verify cleanup within its owned workspace.
    mutates: true
    cleanup_action_id: null
    provenance: *authored
