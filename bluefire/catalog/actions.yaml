schema_version: bluefire.action-catalog.v1
items:
  - schema_version: bluefire.action.v1
    id: sandbox.fixture.create.v1
    title: Create bounded sandbox fixture
    purpose: Create deterministic fixture data inside a runner-owned workspace.
    safety_tier: safe
    capabilities: [sandbox.fixture, filesystem.write]
    platforms: [windows, linux, macos]
    inputs: []
    outputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
        description: Runner-owned workspace reference.
    parameters:
      - name: record_count
        type: integer
        default: 6
        minimum: 1
        maximum: 100
        description: Number of synthetic records to create.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: &authored
      source: BlueFire Nexus canonical sandbox design
      reference: canonical sandbox action contract
      license: MIT
      derived: false
      notes: Declarative contract only; implementation belongs to the reviewed runner.

  - schema_version: bluefire.action.v1
    id: sandbox.fixture.transform.v1
    title: Transform sandbox fixture
    purpose: Normalize and redact fixture records without leaving the runner workspace.
    safety_tier: safe
    capabilities: [sandbox.fixture, filesystem.read, filesystem.write]
    platforms: [windows, linux, macos]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    parameters:
      - name: redact_values
        type: boolean
        default: true
        description: Replace fixture values with deterministic placeholders.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.discovery.list.v1
    title: List sandbox fixture metadata
    purpose: Enumerate fixture records using the runner-owned artifact reference.
    safety_tier: safe
    capabilities: [sandbox.discovery, filesystem.read]
    platforms: [windows, linux, macos]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: &action_discovery_parameters
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of fixture records returned.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.discovery.metadata.v1
    title: Inspect sandbox fixture metadata
    purpose: Produce the same typed discovery records through a metadata-oriented strategy.
    safety_tier: safe
    capabilities: [sandbox.discovery, filesystem.read]
    platforms: [windows, linux, macos]
    inputs:
      - name: fixture
        type: artifact.sandbox.fixture.v1
    outputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    parameters: *action_discovery_parameters
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: endpoint.discovery.system.v1
    title: Discover bounded system identity
    purpose: Report cross-platform operating-system and architecture facts through compiled APIs.
    safety_tier: safe
    capabilities: [endpoint.discovery, system.discovery]
    platforms: [windows, linux, macos]
    inputs: []
    outputs:
      - name: system
        type: artifact.endpoint.system-profile.v1
    parameters: []
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: endpoint.discovery.processes.v1
    title: Discover bounded process identities
    purpose: Enumerate process IDs and names through one compiled platform adapter with bounded output.
    safety_tier: safe
    capabilities: [endpoint.discovery, process.discovery, process.spawn]
    platforms: [windows, linux, macos]
    inputs: []
    outputs:
      - name: processes
        type: artifact.endpoint.process-records.v1
    parameters:
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of process identity records returned.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.discovery.recursive.v1
    title: Recursively discover sandbox files
    purpose: Enumerate a runner-owned workspace subtree with explicit count and depth limits.
    safety_tier: safe
    capabilities: [sandbox.discovery, filesystem.read]
    platforms: [windows, linux, macos]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: records
        type: artifact.sandbox.filesystem.record.v1
        multiple: true
    parameters:
      - name: record_limit
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        description: Maximum number of filesystem records returned.
      - name: max_depth
        type: integer
        default: 3
        minimum: 1
        maximum: 16
        description: Maximum directory depth traversed below the bound workspace.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.archive.tar.v1
    title: Create deterministic sandbox archive
    purpose: Stage selected runner-owned files into an uncompressed deterministic ustar archive.
    safety_tier: controlled
    capabilities: [sandbox.archive, filesystem.read, filesystem.write]
    platforms: [windows, linux, macos]
    inputs:
      - name: records
        type: artifact.sandbox.filesystem.record.v1
        multiple: true
    outputs:
      - name: bundle
        type: artifact.sandbox.archive.v1
    parameters: []
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.collection.stage.v1
    title: Stage sandbox records
    purpose: Package selected fixture records within the runner-owned workspace.
    safety_tier: controlled
    capabilities: [sandbox.collection, filesystem.read, filesystem.write]
    platforms: [windows, linux, macos]
    inputs:
      - name: records
        type: artifact.sandbox.discovery.records.v1
        multiple: true
    outputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    parameters:
      - name: bundle_format
        type: string
        default: jsonl
        enum: [jsonl, json]
        description: Deterministic representation used for the fixture bundle.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.network.loopback.v1
    title: Send bundle to loopback sink
    purpose: Exercise an explicitly loopback-only transport boundary.
    safety_tier: controlled
    capabilities: [sandbox.network, filesystem.read, network.loopback]
    platforms: [windows, linux, macos]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.network.receipt.v1
    parameters:
      - name: port
        type: integer
        default: 4317
        minimum: 1024
        maximum: 65535
        description: Loopback sink port selected by the reviewed runner profile.
    mutates: false
    cleanup_action_id: null
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.export.local.v1
    title: Export bundle locally
    purpose: Preserve a bundle in the approved local export area when transport is blocked.
    safety_tier: controlled
    capabilities: [sandbox.export, filesystem.read, filesystem.write, export.local]
    platforms: [windows, linux, macos]
    inputs:
      - name: bundle
        type: artifact.sandbox.bundle.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.export.receipt.v1
    parameters:
      - name: retention_label
        type: string
        default: ephemeral
        enum: [ephemeral, review]
        description: Policy label, not a filesystem path.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.restricted.persistence-marker.v1
    title: Create restricted-tier persistence detection canary
    purpose: Write one fixed, non-executable marker inside the runner-owned workspace to validate restricted-tier policy, telemetry, and cleanup controls.
    safety_tier: restricted
    capabilities: [sandbox.restricted, filesystem.write]
    platforms: [windows, linux, macos]
    inputs: []
    outputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
        description: Runner-owned restricted canary workspace reference.
      - name: marker
        type: artifact.sandbox.restricted-marker.v1
        description: Fixed-path non-executable persistence-detection marker.
    parameters:
      - name: label
        type: string
        default: persistence_detection_canary
        enum: [persistence_detection_canary, control_validation]
        description: Reviewed semantic label; it never becomes a path, command, or host persistence setting.
    mutates: true
    cleanup_action_id: sandbox.cleanup.v1
    provenance: *authored

  - schema_version: bluefire.action.v1
    id: sandbox.cleanup.v1
    title: Clean sandbox workspace
    purpose: Remove runner-owned temporary artifacts and record the cleanup result.
    safety_tier: safe
    capabilities: [sandbox.cleanup, filesystem.write, cleanup]
    platforms: [windows, linux, macos]
    inputs:
      - name: workspace
        type: artifact.sandbox.workspace.v1
    outputs:
      - name: receipt
        type: artifact.sandbox.cleanup.receipt.v1
    parameters:
      - name: verify_removal
        type: boolean
        default: true
        description: Ask the runner to verify cleanup within its owned workspace.
    mutates: true
    cleanup_action_id: null
    provenance: *authored
