schema_version: bluefire.config.v1
mode: simulate
ai:
  autonomy: "off"
  active_provider: deterministic-offline.v1
  fallback_provider: deterministic-offline.v1
  providers:
    - id: deterministic-offline.v1
      kind: deterministic
      model: deterministic-planner.v1
      timeout_seconds: 1
      max_retries: 0
      max_output_tokens: 800
      redaction:
        enabled: true
        redact_keys: [api_key, authorization, cookie, credential, password, secret, token]
        max_string_chars: 4000
        include_evidence_content: false

    - id: openai-responses.v1
      kind: openai_responses
      model: gpt-4o-mini
      endpoint: https://api.openai.com/v1/responses
      api_key:
        env: OPENAI_API_KEY
      timeout_seconds: 30
      max_retries: 2
      max_output_tokens: 800
      redaction:
        enabled: true
        redact_keys: [api_key, authorization, cookie, credential, password, secret, token]
        max_string_chars: 4000
        include_evidence_content: false
active_profile: sandbox-simulate.v1
runner_profiles:
  - id: sandbox-simulate.v1
    mode: simulate
    environment_type: disposable
    platforms: [windows, linux, macos]
    runner_binary:
      env: BLUEFIRE_RUNNER_BINARY
    sandbox_root:
      env: BLUEFIRE_SANDBOX_ROOT
    scope:
      - sandbox.workspace
      - network.loopback
      - export.local
    network_allowlist:
      - 127.0.0.1/32
      - "::1/128"
    capabilities:
      - sandbox.fixture
      - sandbox.discovery
      - sandbox.collection
      - sandbox.network
      - sandbox.export
      - sandbox.archive
      - sandbox.cleanup
      - native.execution
      - sandbox.identity-material.seed
      - sandbox.identity-material.inspect
      - sandbox.peer
      - sandbox.observability.variant
      - endpoint.discovery
      - system.discovery
      - process.discovery
      - filesystem.read
      - filesystem.write
      - process.spawn
      - network.loopback
      - export.local
      - cleanup
    safety_tiers: [safe, controlled]
    approval_required: false
    enabled_actions: []
    blocked_actions: []
    cleanup_policy: always
    budgets:
      max_steps: 25
      max_seconds: 120
      max_artifacts: 200
      max_bytes: 10485760
    secrets: {}

  - &execute_profile
    id: sandbox-execute.v1
    mode: execute
    environment_type: disposable
    platforms: [windows, linux, macos]
    runner_binary:
      env: BLUEFIRE_RUNNER_BINARY
    sandbox_root:
      env: BLUEFIRE_SANDBOX_ROOT
    scope:
      - sandbox.workspace
      - network.loopback
      - export.local
    network_allowlist:
      - 127.0.0.1/32
      - "::1/128"
    capabilities:
      - sandbox.fixture
      - sandbox.discovery
      - sandbox.collection
      - sandbox.network
      - sandbox.export
      - sandbox.archive
      - sandbox.cleanup
      - native.execution
      - sandbox.identity-material.seed
      - sandbox.identity-material.inspect
      - sandbox.peer
      - sandbox.observability.variant
      - endpoint.discovery
      - system.discovery
      - process.discovery
      - filesystem.read
      - filesystem.write
      - process.spawn
      - network.loopback
      - export.local
      - cleanup
    safety_tiers: [safe, controlled]
    approval_required: true
    enabled_actions:
      - sandbox.execution.native-canary.v1
      - sandbox.identity-material.seed.v1
      - sandbox.identity-material.inspect.v1
      - sandbox.fixture.create.v1
      - sandbox.fixture.transform.v1
      - sandbox.discovery.list.v1
      - sandbox.discovery.metadata.v1
      - endpoint.discovery.system.v1
      - endpoint.discovery.processes.v1
      - sandbox.discovery.recursive.v1
      - sandbox.collection.stage.v1
      - sandbox.archive.tar.v1
      - sandbox.network.loopback.v1
      - sandbox.peer.handoff.v1
      - sandbox.observability.variant.v1
      - sandbox.export.local.v1
      - sandbox.cleanup.v1
    blocked_actions: []
    cleanup_policy: always
    budgets:
      max_steps: 12
      max_seconds: 120
      max_artifacts: 100
      max_bytes: 5242880
    secrets: {}

  - <<: *execute_profile
    id: sandbox-blocked-network.v1
    blocked_actions: [sandbox.network.loopback.v1, sandbox.peer.handoff.v1]

  - <<: *execute_profile
    id: sandbox-restricted-owned.v1
    scope: [sandbox.workspace]
    network_allowlist: []
    capabilities: [sandbox.restricted, sandbox.cleanup, filesystem.write, cleanup]
    safety_tiers: [safe, restricted]
    enabled_actions:
      - sandbox.restricted.persistence-marker.v1
      - sandbox.cleanup.v1
    blocked_actions: []
    budgets:
      max_steps: 4
      max_seconds: 30
      max_artifacts: 16
      max_bytes: 1048576
