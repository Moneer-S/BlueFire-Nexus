schema_version: bluefire.scenario.v1
id: scenario.endpoint.deep-behavior-lab.v1
title: Endpoint Deep Behavior Disposable Lab
purpose: Execute the reviewed endpoint phases for native computation, system and process discovery, a restricted persistence-detection canary, collection and staging, reversible telemetry shaping, one-task credential proof, authorized peer movement, and receipt-bound cleanup.
start: run_native_canary
steps:
  - id: run_native_canary
    behavior_id: sandbox.execution.native-canary.v1
    parameters:
      rounds: 256

  - id: discover_system
    behavior_id: endpoint.discovery.system.v1

  - id: discover_processes
    behavior_id: endpoint.discovery.processes.v1
    parameters:
      record_limit: 20

  - id: create_fixture
    behavior_id: sandbox.fixture.create.v1
    parameters:
      record_count: 8

  - id: transform_fixture
    behavior_id: sandbox.fixture.transform.v1
    parameters:
      redact_values: true
    inputs:
      workspace:
        from_step: create_fixture
        artifact: workspace

  - id: inspect_fixture_metadata
    behavior_id: sandbox.discovery.metadata.v1
    inputs:
      fixture:
        from_step: transform_fixture
        artifact: fixture

  - id: stage_records
    behavior_id: sandbox.collection.stage.v1
    parameters:
      bundle_format: jsonl
    inputs:
      records:
        from_step: inspect_fixture_metadata
        artifact: records

  - id: create_persistence_canary
    behavior_id: sandbox.restricted.persistence-marker.v1
    parameters:
      label: persistence_detection_canary

  - id: create_observability_variant
    behavior_id: sandbox.observability.variant.v1
    parameters:
      representation: chunked_hex
    inputs:
      bundle:
        from_step: stage_records
        artifact: bundle

  - id: authorized_peer_handoff
    behavior_id: sandbox.credential.peer-challenge.v1
    parameters:
      port: 4317
    inputs:
      bundle:
        from_step: stage_records
        artifact: bundle

  - id: cleanup_workspace
    behavior_id: sandbox.cleanup.v1
    parameters:
      verify_removal: true
    inputs:
      workspace:
        from_step: create_fixture
        artifact: workspace

edges:
  - {from_step: run_native_canary, outcome: success, to_step: discover_system}
  - {from_step: discover_system, outcome: success, to_step: discover_processes}
  - {from_step: discover_processes, outcome: success, to_step: create_fixture}
  - {from_step: discover_processes, outcome: partial, to_step: create_fixture}
  - {from_step: create_fixture, outcome: success, to_step: transform_fixture}
  - {from_step: transform_fixture, outcome: success, to_step: inspect_fixture_metadata}
  - {from_step: inspect_fixture_metadata, outcome: success, to_step: stage_records}
  - {from_step: inspect_fixture_metadata, outcome: partial, to_step: stage_records}
  - {from_step: stage_records, outcome: success, to_step: create_persistence_canary}
  - {from_step: stage_records, outcome: partial, to_step: create_persistence_canary}
  - {from_step: create_persistence_canary, outcome: success, to_step: create_observability_variant}
  - {from_step: create_persistence_canary, outcome: partial, to_step: create_observability_variant}
  - {from_step: create_observability_variant, outcome: success, to_step: authorized_peer_handoff}
  - {from_step: create_observability_variant, outcome: partial, to_step: cleanup_workspace}
  - {from_step: create_observability_variant, outcome: blocked, to_step: cleanup_workspace}
  - {from_step: create_observability_variant, outcome: failed, to_step: cleanup_workspace}
  - {from_step: authorized_peer_handoff, outcome: success, to_step: cleanup_workspace}
  - {from_step: authorized_peer_handoff, outcome: partial, to_step: cleanup_workspace}
  - {from_step: authorized_peer_handoff, outcome: blocked, to_step: cleanup_workspace}
  - {from_step: authorized_peer_handoff, outcome: failed, to_step: cleanup_workspace}
provenance:
  source: BlueFire Nexus authored endpoint deep-behavior lab
  reference: scenario.endpoint.deep-behavior-lab.v1
  license: MIT
  derived: false
  notes: Uses only compiled reviewed actions, fixed runner-owned artifacts, a managed one-task HMAC capability, and distinct one-shot processes on literal loopback.

limitations:
  - The persistence phase is a fixed non-executable detection canary inside the runner-owned workspace; it never changes startup configuration, services, scheduled tasks, login items, registry state, or another host mechanism.
  - Credential research is limited to proving one high-entropy capability derived for the approved task and ephemeral receiver; the runner never reads user, host, browser, cloud, or adjacent credentials.
  - Peer movement is limited to a separately managed disposable receiver on literal 127.0.0.1 and does not compromise or authorize another host.
  - The observability variant is transparent and reversible telemetry shaping for side-by-side defensive observation; it is not a bypass or control-impairment mechanism.
  - A successful simulation remains synthetic and cannot prove credential possession, peer processes, runner effects, independent observation, or cleanup.
