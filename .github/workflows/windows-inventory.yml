name: Windows sensor inventory

on:
  pull_request:
    paths:
      - .github/workflows/windows-inventory.yml
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    name: Sensor inventory on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Read sensor state and check one process start
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Row($name, $value) {
            if ($null -eq $value -or "$value" -eq '') { $value = 'Unknown' }
            Write-Host "$name = $value"
            "| $name | $value |" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          $failed = [Collections.Generic.List[string]]::new()
          function Observe($name, [scriptblock]$read) {
            try { & $read }
            catch {
              $failed.Add($name)
              Row $name "Query failed ($($_.Exception.GetBaseException().GetType().Name))"
            }
          }
          @('## Windows sensor inventory', '', '| Measurement | Result |', '|---|---|') |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Row 'Runner image version' $env:ImageVersion
          Observe 'Windows build' {
            $os = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name CurrentBuildNumber, UBR
            Row 'Windows build' "$($os.CurrentBuildNumber).$($os.UBR)"
          }
          Observe 'Sensor services' {
            $filter = "Name='WinDefend' OR Name='Sysmon' OR Name='Sysmon64'"
            $services = Get-CimInstance Win32_Service -Filter $filter -Property Name, State
            foreach ($name in 'WinDefend', 'Sysmon', 'Sysmon64') {
              $service = $services | Where-Object Name -eq $name
              if ($service) { Row "$name service" $service.State } else { Row "$name service" 'Absent' }
            }
          }
          Observe 'Defender status' {
            if (!(Get-Module -ListAvailable -Name Defender)) { Row 'Defender status' 'Module absent'; return }
            $status = Get-MpComputerStatus
            foreach ($field in 'AMRunningMode', 'AMServiceEnabled', 'AntivirusEnabled', 'RealTimeProtectionEnabled') {
              Row "Defender $field" $status.$field
            }
          }
          Observe 'Built-in Sysmon feature' {
            $feature = Get-WindowsOptionalFeature -Online | Where-Object FeatureName -eq 'Sysmon'
            if ($feature) { Row 'Built-in Sysmon feature' $feature.State }
            else { Row 'Built-in Sysmon feature' 'Not listed in this image' }
          }
          Observe 'Process creation system audit policy' {
            $policy = & "$env:SystemRoot\System32\auditpol.exe" /get '/subcategory:{0CCE922B-69AE-11D9-BED3-505054503030}' /r
            if ($LASTEXITCODE -ne 0) { throw 'auditpol failed' }
            $setting = ($policy | ConvertFrom-Csv).'Inclusion Setting'
            if ($setting -notin 'No Auditing', 'Success', 'Failure', 'Success and Failure') { $setting = 'Unknown (policy format)' }
            Row 'Process creation system audit policy' $setting
          }

          $channels = @('Security', 'Microsoft-Windows-Sysmon/Operational', 'Microsoft-Windows-Windows Defender/Operational')
          $state = @{}
          foreach ($channel in $channels) {
            Observe "$channel channel" {
              try {
                $config = [System.Diagnostics.Eventing.Reader.EventLogConfiguration]::new($channel)
                try { $state[$channel] = if ($config.IsEnabled) { 'Enabled' } else { 'Disabled' } }
                finally { $config.Dispose() }
              } catch [System.Diagnostics.Eventing.Reader.EventLogNotFoundException] { $state[$channel] = 'Absent' }
              Row "$channel channel" $state[$channel]
            }
          }

          # Match the child's PID, its creator PID and time on the event-log service.
          # Security renders process IDs in hex; Sysmon uses decimal process IDs.
          Observe 'Process observation' {
            $start = [datetime]::UtcNow
            $stamp = $start.ToString("yyyy-MM-ddTHH:mm:ss.fffffffZ", [cultureinfo]::InvariantCulture)
            $marker = 'bluefire-inventory-' + [guid]::NewGuid().ToString('N')
            $info = [Diagnostics.ProcessStartInfo]::new("$env:SystemRoot\System32\cmd.exe", "/d /c rem $marker")
            $info.UseShellExecute = $false
            $process = [Diagnostics.Process]::Start($info)
            try {
              $child = $process.Id
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) { throw 'Probe exited unsuccessfully' }
            } finally { $process.Dispose() }
            Row 'Marked process' 'Exited successfully'
            Start-Sleep -Seconds 10
            $checks = @(
              @{ Log = $channels[0]; Id = 4688; Provider = 'Microsoft-Windows-Security-Auditing'
                 ChildField = 'NewProcessId'; Child = ('0x{0:x}' -f $child); ParentField = 'ProcessId'; Parent = ('0x{0:x}' -f $PID) }
              @{ Log = $channels[1]; Id = 1; Provider = 'Microsoft-Windows-Sysmon'
                 ChildField = 'ProcessId'; Child = $child; ParentField = 'ParentProcessId'; Parent = $PID }
            )
            foreach ($check in $checks) {
              $label = "$($check.Log) event $($check.Id)"
              Observe $label {
                if ($state[$check.Log] -ne 'Enabled') {
                  $reason = $state[$check.Log]
                  if (!$reason) { $reason = 'state unknown' }
                  Row $label "Skipped (channel $reason)"
                  return
                }
                $system = "Provider[@Name='$($check.Provider)'] and EventID=$($check.Id) and TimeCreated[@SystemTime >= '$stamp']"
                $data = "Data[@Name='$($check.ChildField)']='$($check.Child)' and Data[@Name='$($check.ParentField)']='$($check.Parent)'"
                $query = [System.Diagnostics.Eventing.Reader.EventLogQuery]::new($check.Log, 'LogName', "*[System[$system] and EventData[$data]]")
                $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new($query)
                try {
                  $reader.BatchSize = 1
                  $event = $reader.ReadEvent()
                  if ($null -ne $event) { $event.Dispose(); Row $label 'Observed' }
                  else { Row $label 'No match at the 10-second check' }
                } finally { $reader.Dispose() }
              }
            }
          }
          if ($failed.Count -gt 0) { throw 'One or more measurements failed. See the job summary.' }

  builtin-sysmon:
    name: Built-in Sysmon on Windows Server 2025
    runs-on: windows-2025
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Enable the in-box feature and check one process start
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Report($name, $value) {
            Write-Host "$name = $value"
            "- $name = $value" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          function InBoxCandidates {
            Get-Command Sysmon.exe -CommandType Application -All -ErrorAction Ignore |
              Where-Object { $_.Path.StartsWith("$env:SystemRoot\", [StringComparison]::OrdinalIgnoreCase) } |
              Select-Object -ExpandProperty Path -Unique
          }
          Report 'Runner image' $env:ImageVersion
          $feature = Get-WindowsOptionalFeature -Online | Where-Object FeatureName -eq Sysmon
          if (!$feature) { Report 'Outcome' 'Feature absent'; return }
          Report 'Feature before enable' $feature.State
          if ($feature.State -notin 'Disabled', 'DisabledWithPayloadRemoved') { Report 'Outcome' 'Expected the feature to start disabled'; return }
          if (Get-Service 'Sysmon*') { Report 'Outcome' 'Existing Sysmon service'; return }
          $before = @(InBoxCandidates)
          try {
            $result = Enable-WindowsOptionalFeature -Online -FeatureName Sysmon -NoRestart
          } catch {
            $code = '0x{0:X8}' -f $_.Exception.GetBaseException().HResult
            if ($code -in '0x800F081F', '0x800F0906') { Report 'Outcome' "Feature payload unavailable ($code)"; return }
            Report 'DISM error' $code
            throw 'Could not enable the feature'
          }
          $after = (Get-WindowsOptionalFeature -Online -FeatureName Sysmon).State
          Report 'RestartNeeded' $result.RestartNeeded
          Report 'Feature after enable' $after
          if ($result.RestartNeeded -or "$after" -match 'Pending') { Report 'Outcome' 'Restart required'; return }
          if ($null -eq $result.RestartNeeded -or $after -ne 'Enabled') { throw 'Enable result inconclusive' }

          # Invoke only a Windows-directory command newly exposed by feature enablement.
          $cli = @(InBoxCandidates | Where-Object { $_ -notin $before })
          if ($cli.Count -ne 1) { Report 'Outcome' 'Could not identify one new in-box Sysmon executable'; return }
          $setup = Start-Process -FilePath $cli[0] -ArgumentList '-i' -WindowStyle Hidden -Wait -PassThru
          Report 'Sysmon setup exit code' $setup.ExitCode
          if ($setup.ExitCode -ne 0) { throw 'Default Sysmon setup failed' }
          $services = @(Get-Service 'Sysmon*' | ForEach-Object { "$($_.Name) $($_.Status)" })
          Report 'Sysmon service' ($services -join ', ')
          $channel = 'Microsoft-Windows-Sysmon/Operational'
          $enabled = (Get-WinEvent -ListLog $channel).IsEnabled
          Report 'Operational channel enabled' $enabled
          if (!$enabled) { Report 'Outcome' 'Channel disabled'; return }

          $stamp = [datetime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ss.fffffffZ", [cultureinfo]::InvariantCulture)
          $marker = 'bluefire-inbox-' + [guid]::NewGuid().ToString('N')
          $info = [Diagnostics.ProcessStartInfo]::new("$env:SystemRoot\System32\cmd.exe", "/d /c rem $marker")
          $info.UseShellExecute = $false
          $child = [Diagnostics.Process]::Start($info)
          $child.WaitForExit()
          if ($child.ExitCode -ne 0) { throw 'Marker failed' }
          $filter = "*[System[Provider[@Name='Microsoft-Windows-Sysmon'] and EventID=1 and TimeCreated[@SystemTime >= '$stamp']] and EventData[Data[@Name='ProcessId']='$($child.Id)' and Data[@Name='ParentProcessId']='$PID']]"
          Start-Sleep -Seconds 15
          $query = [System.Diagnostics.Eventing.Reader.EventLogQuery]::new($channel, 'LogName', $filter)
          $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new($query)
          try {
            $reader.BatchSize = 1
            $entry = $reader.ReadEvent()
            if ($entry) { $entry.Dispose(); Report 'Event 1 for marker' 'Observed' }
            else { Report 'Event 1 for marker' 'No match at the 15-second check' }
          } finally { $reader.Dispose(); $child.Dispose() }
