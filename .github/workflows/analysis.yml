name: security and quality analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maintained package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify detect-secrets baseline
        run: |
          detect-secrets scan --all-files --baseline .secrets.baseline
          git diff --exit-code -- .secrets.baseline

      - name: Static security analysis
        run: python -m bandit -r bluefire -ll

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Generate Python environment SBOM
        run: cyclonedx-py environment --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: sbom.json
