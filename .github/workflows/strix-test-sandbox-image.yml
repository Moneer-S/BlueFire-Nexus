      - name: Bind the exact packaged service wheel
        id: product
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "bluefire-product-source"
          wheels = list((source / "dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one product wheel")
          wheel = wheels[0].resolve(strict=True)
          with zipfile.ZipFile(wheel) as archive:
              members = [name for name in archive.namelist() if name == (
                  "bluefire/_build_info.json"
              ) or re.fullmatch(
                  r"[^/]+\.data/(?:purelib|platlib)/bluefire/_build_info\.json", name
              )]
              if len(members) != 1:
                  raise SystemExit("product wheel source metadata is ambiguous")
              metadata = json.loads(archive.read(members[0]))
          if metadata.get("source_revision") != "${{ github.sha }}" or (
              metadata.get("source_provenance") != "git_archive"
          ):
              raise SystemExit("product wheel does not match the archived revision")
          digest = "sha256:" + hashlib.sha256(wheel.read_bytes()).hexdigest()
          print(f"wheel={wheel}")
          print(f"digest={digest}")
          PY

