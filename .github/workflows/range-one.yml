name: range one

# Range one is a small network of disposable containers with a path of published attack
# tests through it, written in lab/range/range-one.yaml. Every container of a range sits
# on internal networks with no route out. A run proves that on the created containers
# before they start, and from inside them right after the start, before the engine waits
# for anything in the range; the probes between the hosts follow once their services
# listen. The jobs hold no secrets and a read-only token.
#
# It also runs on main: a pull request's build can read the image cache that the last run
# on its base branch left, so while that cache is there a pull request that changes no image
# builds nothing and needs no package server. GitHub drops a cache that no run has used for
# seven days, or when the repository's caches pass their limit; the build then fetches its
# packages again.

on:
  pull_request:
    paths:
      - lab/**
      - .github/workflows/range-one.yml
  push:
    branches:
      - main
    paths:
      - lab/**
      - .github/workflows/range-one.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The lab starts each test of the path itself, so its argument vectors must be the ones
  # Invoke-AtomicRedTeam would start. This job runs Invoke-AtomicRedTeam for every step with
  # stand-ins for sh and bash that only record how they were started: no test runs here.
  atomic-parity:
    name: argument vectors against Invoke-AtomicRedTeam
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POWERSHELL_YAML_VERSION: 0.4.12
      SPEC: lab/range/range-one.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab and the executor's dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab
          sudo pwsh -NoLogo -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module powershell-yaml -RequiredVersion $POWERSHELL_YAML_VERSION -Scope AllUsers -Force"
          pwsh --version

      - name: Fetch the tests and the executor at the spec's pins
        run: |
          spec() { "$RUNNER_TEMP/venv/bin/python" -c "import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); print($1)" "$SPEC"; }
          atomic_red_team=$(spec 'd["atomic_red_team"]["repo"] + "@" + d["atomic_red_team"]["commit"]')
          executor=$(spec 'd["executor"]["reference"] + "@" + d["executor"]["commit"]')
          fetch() {
            git init -q "$2"
            git -C "$2" remote add origin "https://github.com/${1%@*}"
            git -C "$2" fetch -q --depth 1 --filter=blob:none origin "${1#*@}"
          }
          checkout() {
            git -C "$2" checkout -q FETCH_HEAD
            test "$(git -C "$2" rev-parse HEAD)" = "${1#*@}"
          }
          # The executor runs privateConfig.ps1 from the folder above its checkout when it
          # exists, so that folder is a new one.
          mkdir "$RUNNER_TEMP/upstream"
          fetch "$executor" "$RUNNER_TEMP/upstream/invoke-atomicredteam"
          checkout "$executor" "$RUNNER_TEMP/upstream/invoke-atomicredteam"
          fetch "$atomic_red_team" "$RUNNER_TEMP/atomic-red-team"
          # Only the folders of the path's techniques are checked out.
          spec '"\n".join(sorted({"atomics/" + s["technique"] for s in d["path"]["steps"]}))' \
            | git -C "$RUNNER_TEMP/atomic-red-team" sparse-checkout set --stdin
          checkout "$atomic_red_team" "$RUNNER_TEMP/atomic-red-team"
          # A range host has the atomics at /opt/atomics, and the path goes into the commands.
          test ! -e /opt/atomics
          sudo install -d -o "$USER" /opt/atomics
          cp -r "$RUNNER_TEMP/atomic-red-team/atomics/." /opt/atomics/

      - name: Write the lab's argument vectors
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" atomic argv "$SPEC" --atomics /opt/atomics \
            --out "$RUNNER_TEMP/argv.json"

      - name: Compare them with what Invoke-AtomicRedTeam starts
        run: |
          python3 -I lab/range/atomic_parity.py --expected "$RUNNER_TEMP/argv.json" \
            --executor "$RUNNER_TEMP/upstream/invoke-atomicredteam" --work "$RUNNER_TEMP/parity" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the argument vectors
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomic-argv
          path: ${{ runner.temp }}/argv.json
          retention-days: 30
          if-no-files-found: error

  # The seal on a range of three bare containers on two networks
  # (lab/range/seal-check.yaml): it passes, and each of five planted breaks fails
  # it for its own reason.
  seal:
    name: the range is sealed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPEC: lab/range/seal-check.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab
          echo "LAB=$RUNNER_TEMP/venv/bin/bluefire-lab" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/seal" >> "$GITHUB_ENV"
          docker version

      - name: The seal holds
        run: '"$LAB" range run "$SPEC" --out "$OUT/sealed"'

      # Each of these breaks is caught by the static seal, on containers that were created
      # and never started, except the missing isolated gateway mode: with that one only, the
      # run starts the containers (their networks are internal) to show that the host canary
      # catches it too, in the phase right after the start, before the ready gate.
      - name: Planted breaks fail the seal
        run: |
          planted() {
            local code=0
            "$LAB" range run "$SPEC" --out "$OUT/$1" --plant "$1" || code=$?
            if [ "$code" -ne 3 ]; then echo "plant $1: exit code $code, not 3"; return 1; fi
            if ! jq -e --arg check "$2" --arg phase "$3" \
              '[.phases[] | select(.phase == $phase) | .checks[] | select(.check == $check and .pass == false)] | length > 0' \
              "$OUT/$1/seal.json" > /dev/null; then
              echo "plant $1: the check \"$2\" did not fail in the phase \"$3\""
              return 1
            fi
            echo "plant $1: caught by $2 in the phase $3"
          }
          planted not-internal "network: internal" static
          planted no-isolated-gateway "host canary" "no way out"
          planted published-port "container: port bindings" static
          planted bind-mount "container: mounts" static

      # An extra container, on an internal network of its own, is connected to a range network
      # after the seal passed, while the range is held where the path will run.
      - name: A network connect after the seal makes the run invalid
        run: |
          "$LAB" range run "$SPEC" --out "$OUT/connect" --hold 120 &
          run=$!
          for _ in $(seq 1 120); do
            if jq -e '.phases[] | select(.phase == "segmentation" and .passed)' "$OUT/connect/seal.json" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          image=$(jq -r '.containers.left.image_id' "$OUT/connect/manifest.json")
          network=$(jq -r '.networks.west.id' "$OUT/connect/manifest.json")
          extra_network=$(docker network create --internal -o com.docker.network.bridge.gateway_mode_ipv4=isolated \
            --label bluefire.lab.range=seal-check-extra bluefire-lab-extra)
          extra=$(docker run -d --name bluefire-lab-extra --network "$extra_network" \
            --label bluefire.lab.range=seal-check-extra "$image")
          docker network connect "$network" "$extra"
          code=0
          wait "$run" || code=$?
          docker rm -f "$extra"
          "$LAB" range down "$SPEC"
          docker network rm "$extra_network"
          if [ "$code" -ne 4 ]; then echo "exit code $code, not 4"; exit 1; fi
          if ! jq -e --arg c "$extra" --arg n "$network" \
            '[.watch.findings[] | select(.type == "network" and .action == "connect" and .id == $n and .container == $c)] | length > 0' \
            "$OUT/connect/seal.json" > /dev/null; then
            echo "the event watch did not report the connect of the extra container"
            exit 1
          fi
          jq -e '[.phases[].checks[] | select(.check == "event watch" and .pass == false)] | length > 0' \
            "$OUT/connect/seal.json" > /dev/null
          echo "plant connect: caught by event watch"

      - name: Summary
        if: always()
        run: |
          if [ -f "$OUT/sealed/seal.md" ]; then cat "$OUT/sealed/seal.md" >> "$GITHUB_STEP_SUMMARY"; fi
          {
            echo
            echo "### Planted breaks"
            echo
            echo "| Break | Exit code | Checks that failed |"
            echo "|---|---|---|"
            for plant in not-internal no-isolated-gateway published-port bind-mount connect; do
              if [ -f "$OUT/$plant/seal.json" ]; then
                code=$(jq -r '.exit_code' "$OUT/$plant/manifest.json")
                caught=$(jq -r '[.phases[].checks[] | select(.pass == false) | .check] | unique | join(", ")' "$OUT/$plant/seal.json")
                echo "| $plant | $code | $caught |"
              else
                echo "| $plant | not run | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Take down what is left
        if: always()
        run: |
          docker rm -f bluefire-lab-extra 2> /dev/null || true
          "$LAB" range down "$SPEC"
          docker network rm bluefire-lab-extra 2> /dev/null || true
          docker ps -a --filter name=bluefire-lab
          docker network ls --filter name=bluefire-lab

      - name: Upload the seal records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: range-seal
          path: ${{ runner.temp }}/seal
          retention-days: 30
          if-no-files-found: error

  # Range one's seven hosts on its three networks (lab/range/range-one.yaml), built from the
  # spec with everything the path needs planted in them. The run seals the range, waits until
  # the defense is ready, checks that each plant is in place with single uses of what is
  # planted, starts the shop's ordinary activity, makes a few harmless marks on the three
  # agent hosts, runs the path of published tests inside the sealed range, checks the seal
  # again, counts how many lines of each watched log reached the manager and how often each
  # job of the activity ran and was seen, writes every archived event and alert as an ECS
  # line with its origin, and scores the alerts the stock rules raised on the shop's own work.
  # The path alone can take about 25 minutes: s01 has a timeout of 600 s, and the two port
  # scans, which try every port, run to their timeout of 300 s each.
  range-one:
    name: range one's path, sealed and watched
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPEC: lab/range/range-one.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab
          echo "LAB=$RUNNER_TEMP/venv/bin/bluefire-lab" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/range-one" >> "$GITHUB_ENV"
          docker version

      # Fetches the published files the hosts carry at the spec's commit, checks each against
      # lab/range/range-one.lock, and writes the Dockerfile and the bake file.
      # Each image gets a cache scope of its own: the GitHub Actions cache keeps one index per
      # scope, and the last image written to a shared scope would replace the others' entries.
      - name: Render the images
        id: render
        run: |
          "$LAB" range render "$SPEC" --out range-build
          {
            echo "cache<<EOF"
            jq -r '.target | keys[] | "\(.).cache-from=type=gha,scope=range-one-\(.)",
              "\(.).cache-to=type=gha,mode=max,scope=range-one-\(.)"' range-build/bake.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Start the build clock
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # The run below finds every image under the tag of this build context and builds nothing.
      - name: Build the images
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: ./range-build
          files: ./bake.json
          load: true
          set: ${{ steps.render.outputs.cache }}

      # How long the images took: a first run on an empty cache builds every step, a later one
      # should find most of them. The build action writes its own summary of each image's
      # steps and how many came from the cache.
      - name: Stop the build clock
        if: always()
        run: echo "BUILD_SECONDS=$(( $(date +%s) - BUILD_STARTED ))" >> "$GITHUB_ENV"

      # The path runs between the activity's warm-up and its tail, so the ordinary activity runs
      # for as long as the path, which is long enough for cron to start each cron job.
      - name: Run the range
        run: |
          "$LAB" range run "$SPEC" --out "$OUT/run"

      # Every planned step ran and was attempted, nothing stopped the path, the last step took
      # effect and the goal check passed.
      - name: The path ran through the range and reached its goal
        run: |
          if ! jq -e '
            .path.planned == [.path.steps[].id]
            and (.path.planned | length > 0)
            and .path.stopped == null
            and (.path | has("skipped") | not)
            and (.path.steps | all(.happened == "took effect" or .happened == "attempted without effect"))
            and .path.steps[-1].happened == "took effect"
            and .path.goal.passed == true
          ' "$OUT/run/manifest.json" > /dev/null; then
            jq '{result, reason, path: (.path | {skipped, stopped, goal: (.goal | {passed, why}),
              steps: [.steps[] | {id, happened, why, exit_code, check: .check.result}]})}' \
              "$OUT/run/manifest.json"
            exit 1
          fi

      # The engine flags a delivery gap and does not fail the run on it: a lost event is a result
      # about the defense. This job is there to show that the defense sees every agent host and
      # that the plants are in place, so here a gap, a mark that did not arrive, a broken decoder,
      # a configuration that is not the lab's edits or a plant check that failed fails it.
      - name: The defense saw every mark and every line, and every plant is in place
        run: |
          if ! jq -e '
            .result == "sealed"
            and .defense.delivery_gap == false
            and (.defense.marks | length > 0 and all(.made and .archived))
            and ([.defense.marks[].host] | unique) == (.defense.agents | sort)
            and .defense.snoopy_tag.works == true
            and ([.defense.configuration[] | .matches_the_lab_edits] | length > 0 and all)
            and (.defense | has("collect_error") | not)
            and .plants.passed == true
            and (.ready.plants | length > 0 and all(.pass))
          ' "$OUT/run/manifest.json" > /dev/null; then
            jq '{result, reason, plants: [.plants.checks[]? | select(.pass | not)],
              ready: [.ready.plants[]? | select(.pass | not)],
              defense: (.defense | {delivery_gap, delivery_findings, snoopy_tag, collect_error,
                configuration: (.configuration | map_values(.matches_the_lab_edits // .error))})}' \
              "$OUT/run/manifest.json"
            exit 1
          fi

      # Each job of the ordinary activity ran at least once, counted from the logs of the host
      # it acts on, and the line of at least one of its runs reached the manager's archive.
      - name: Every job of the ordinary activity ran and reached the archive
        run: |
          if ! jq -e '
            (.activity.jobs | length) == (.activity.schedule | length)
            and (.activity.jobs | length > 0)
            and (.activity.jobs | all(.runs != null and .runs >= 1 and ."archived runs" != null and ."archived runs" >= 1))
          ' "$OUT/run/manifest.json" > /dev/null; then
            jq '.activity | {go, stop, jobs}' "$OUT/run/manifest.json"
            exit 1
          fi

      # Every line of the manager's archive and alerts is in events.ecs.ndjson and alerts.ecs.ndjson,
      # one ECS line for each, and the ordinary day was scored. When the conversion fails the run
      # is invalid, "Run the range" exits 4 and this step does not run; the summary's score.md
      # gives the reason. This step checks the counts of a run that ended sealed.
      - name: Every archived event and alert is an ECS line, and the ordinary day is scored
        run: |
          if ! jq -e '
            .ecs.error == null
            and (.ecs.files | keys) == ["alerts.ecs.ndjson", "events.ecs.ndjson", "steps.ecs.ndjson"]
            and (.ecs.files | all(."raw lines" == ."ECS lines" and ."raw lines" > 0))
            and .score.scored == true
          ' "$OUT/run/manifest.json" > /dev/null; then
            jq '{ecs, score: (.score | {scored, "not scored"})}' "$OUT/run/manifest.json"
            exit 1
          fi
          for file in events.ecs.ndjson alerts.ecs.ndjson steps.ecs.ndjson; do
            echo "$file: $(wc -l < "$OUT/run/$file") lines"
          done

      # What the defense made of each step is scored, and recording.json, the run in the format the
      # app's live view plays, was written; the single replay page is made from it. The clock check must
      # pass, or the race is not a result and the job fails rather than show it.
      - name: Every step is scored, and the recording plays
        run: |
          if ! jq -e '
            (.score.path.steps | length) == (.path.planned | length)
            and (.score.path.race | has("says"))
            and .score.path.clock.agree == true
            and .recording.error == null
          ' "$OUT/run/manifest.json" > /dev/null; then
            jq '{recording, race: .score.path.race, clock: .score.path.clock}' "$OUT/run/manifest.json"
            exit 1
          fi
          "$LAB" replay "$OUT/run/recording.json" --template bluefire/ui/replay.html \
            --out "$OUT/run/replay.html" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Summary
        if: always()
        run: |
          {
            echo "Image build, from the end of the builder's set-up: ${BUILD_SECONDS:-?} s."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for part in path plants activity score defense seal; do
            if [ -f "$OUT/run/$part.md" ]; then cat "$OUT/run/$part.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Take down what is left
        if: always()
        run: |
          "$LAB" range down "$SPEC"
          docker ps -a --filter name=bluefire-lab
          docker network ls --filter name=bluefire-lab

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: range-one-run
          path: ${{ runner.temp }}/range-one
          retention-days: 30
          if-no-files-found: error
