name: Strix engine candidate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: strix-engine-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed Strix candidate without execution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact BlueFire revision without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          check-latest: false

      - name: Set up exact Go toolchain for the upstream build hook
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.10"
          cache: false

      - name: Set up exact uv build frontend without a shared cache
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Build provenance-bound candidate
        shell: bash
        run: >-
          python -m tools.build_strix_engine_candidate
          --work-root "$RUNNER_TEMP/bluefire-strix-candidate-work"
          --output-root "$RUNNER_TEMP/bluefire-strix-candidate-output"
          --bluefire-source-revision "${{ github.sha }}"

      # No Actions artifacts: the component redistribution review remains blocked.
      # Wheel, modified source, dependencies, and OCI inventory stay in runner-temp.
