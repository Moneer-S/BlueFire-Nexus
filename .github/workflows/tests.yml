name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Component and contract tests
        run: pnpm test

      - name: Build packaged UI
        run: pnpm build

      - name: Verify packaged assets are current
        working-directory: .
        run: git diff --exit-code -- bluefire/ui

      - name: Install Playwright Chromium
        run: pnpm test:e2e:install

      - name: Browser accessibility and workflow tests
        run: pnpm test:e2e

  python:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install maintained package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,detections]"

      - name: Build bounded Rust runner for Python Execute tests
        run: cargo build --locked --manifest-path runner/Cargo.toml --bin bluefire-runner

      - name: Compile
        run: python -m compileall -q bluefire tests_platform

      - name: Test
        env:
          BLUEFIRE_E2E_RUNNER: ${{ github.workspace }}/runner/target/debug/bluefire-runner${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m pytest

      - name: Lint
        run: python -m ruff check bluefire tests_platform

      - name: Format
        run: python -m black --check bluefire tests_platform

      - name: Type-check
        run: python -m mypy bluefire

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling only
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/bluefire-wheel-smoke"
          "$RUNNER_TEMP/bluefire-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/bluefire-wheel-smoke/bin/python" -m pip install dist/*.whl

      - name: Installed-wheel Simulate smoke outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/bluefire-wheel-smoke/bin/bluefire" --help
          "$RUNNER_TEMP/bluefire-wheel-smoke/bin/bluefire" --runs-dir "$RUNNER_TEMP/bluefire-wheel-runs" scenario validate --scenario-id scenario.restricted.persistence-canary.v1
          "$RUNNER_TEMP/bluefire-wheel-smoke/bin/bluefire" --runs-dir "$RUNNER_TEMP/bluefire-wheel-runs" scenario run --scenario-id scenario.restricted.persistence-canary.v1 --mode simulate --autonomy off

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*

  rust:
    name: Rust runner · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path runner/Cargo.toml -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path runner/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path runner/Cargo.toml --all

      - name: Build release runner
        run: cargo build --locked --release --manifest-path runner/Cargo.toml --bin bluefire-runner

      - name: Upload platform runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluefire-runner-${{ runner.os }}
          path: runner/target/release/bluefire-runner${{ runner.os == 'Windows' && '.exe' || '' }}
