name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install maintained package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q bluefire tests_platform

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check bluefire tests_platform

      - name: Format
        run: python -m black --check bluefire tests_platform

      - name: Type-check
        run: python -m mypy bluefire

      - name: Build package
        run: python -m build

      - name: CLI smoke
        run: |
          bluefire --help
          bluefire scenario validate scenarios/sandbox_research_chain.yaml

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --manifest-path runner/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path runner/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path runner/Cargo.toml --all
