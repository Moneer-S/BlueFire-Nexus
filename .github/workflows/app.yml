name: app

# Checks that the app still behaves for the person using it: the service's
# tests, the interface's types, lint, logic tests and build, the browser tests
# of its screens, and the one-command start. Each job is meant to finish in a
# few minutes. The runner's own tests are in runner.yml.

on:
  pull_request:
    paths:
      - bluefire/**
      - frontend/**
      - scenarios/**
      - config/**
      - tests_platform/**
      - pyproject.toml
      - setup.py
      - compose.yaml
      - docker/**
      - .dockerignore
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - bluefire/**
      - frontend/**
      - scenarios/**
      - config/**
      - tests_platform/**
      - pyproject.toml
      - setup.py
      - compose.yaml
      - docker/**
      - .dockerignore
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PNPM_VERSION: 11.19.0

jobs:
  service:
    name: service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the app and its test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e ".[detections,test]"

      # Every test starts a service of its own, so they run side by side. Started
      # as a module so that the tests can import each other from the repository's root.
      - name: Test
        env:
          # A hosted runner can be several times slower than a workstation. The tests wait a
          # short time for a background job so that a hung job fails. This stretches those
          # waits, not what the tests check: see tests_platform/conftest.py.
          BLUEFIRE_TEST_WAIT_SCALE: "4"
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -n auto'

  interface:
    name: interface types, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install the locked dependencies
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Logic tests
        run: pnpm test

      - name: Build the interface
        run: pnpm build

      # A file the build adds counts too, not only one it changes.
      - name: The committed interface is the one this source builds
        working-directory: .
        run: |
          changed=$(git status --porcelain -- bluefire/ui)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "bluefire/ui is not what frontend/ builds: run pnpm build in frontend/ and commit bluefire/ui"
            exit 1
          fi

  browser:
    name: screens in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The image holds the browser build that the locked Playwright version drives.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the locked dependencies
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          pnpm install --frozen-lockfile

      # The interface built with its sample data, with no service behind it.
      - name: Open the screens of the demo build
        run: pnpm test:e2e

      # The real thing: the Python service serving the committed interface.
      - name: Install the app
        working-directory: .
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -e .

      - name: Open the screens the service serves
        env:
          BLUEFIRE_PYTHON: /tmp/venv/bin/python
        run: pnpm test:service

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  start:
    name: one-command start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start the app as the front page says
        run: docker compose up --detach --quiet-pull app

      - name: The interface answers and the service printed its address
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output "$RUNNER_TEMP/index.html" http://127.0.0.1:8765/; then break; fi
            sleep 1
          done
          grep --quiet '<div id="root">' "$RUNNER_TEMP/index.html"
          docker compose logs app | grep --quiet 'http://127.0.0.1:8765/#bluefire-session='

      - name: Stop it
        if: always()
        run: docker compose down --volumes
