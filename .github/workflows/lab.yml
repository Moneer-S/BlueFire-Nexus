name: lab

# Runs published attack tests on a hosted runner, records what a sensor on the
# runner saw, has a rule engine evaluate pinned detection rules over those
# records, and publishes a report. The runner is thrown away after the job.
# A pull request that changes the lab's own rules or the sensors' settings runs
# the tests twice, with the base commit's files and with its own, and compares
# the two recordings. The jobs hold no secrets and a read-only token.

on:
  pull_request:
    paths:
      - lab/**
      - .github/workflows/lab.yml
  push:
    branches: [main]
    paths:
      - lab/**
      - .github/workflows/lab.yml
  schedule:
    # Weekly, so that a recent run always exists.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SYSMON_VERSION: 1.6.0
  SYSINTERNALS_EBPF_VERSION: 2.3.0
  AUDITD_VERSION: 1:3.1.2-2.1ubuntu0.1
  POWERSHELL_YAML_VERSION: 0.4.12
  INVOKE_ATOMICREDTEAM: redcanaryco/invoke-atomicredteam@8af478bb9e4637df568ac1e596553b025b16cd1b
  ATOMIC_RED_TEAM: redcanaryco/atomic-red-team@a0e3f9bc69fed2fd711bd1f1aa87a40c33482fe6
  SIGMA: SigmaHQ/sigma@552f3fee420ef232a8e5790c4fae591847e32347
  ZIRCOLITE_URL: https://github.com/wagga40/Zircolite/releases/download/v4.7.1/Zircolite-4.7.1-linux-x64.zip
  ZIRCOLITE_DIGEST: sha256:f09d3ba377ef0bf4899bba71b63ffca38d714f71765a716e46ad3549da5e316a

jobs:
  package:
    name: lab package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: No em dash in what the lab writes
        run: if grep -rn --exclude-dir=fixtures $'\xe2\x80\x94' lab; then echo "write the sentence without the em dash"; exit 1; fi

      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e "lab[dev]"

      - name: Lint
        run: |
          "$RUNNER_TEMP/venv/bin/ruff" check lab
          "$RUNNER_TEMP/venv/bin/ruff" format --check lab

      - name: Test
        run: '"$RUNNER_TEMP/venv/bin/pytest" --rootdir lab -c lab/pyproject.toml lab/tests'

  # A pull request that changes what a run loads of the defense (the lab's own rules, the sensors'
  # settings) is shown as a pair of fresh runs: the whole list with the base commit's files, and again
  # with the head's, each on a runner of its own. The digests of those files decide, not the paths.
  plan:
    name: decide whether the change needs a pair of runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pair: ${{ steps.decide.outputs.pair }}
      sides: ${{ steps.decide.outputs.sides }}
      change: ${{ steps.decide.outputs.change }}
      said: ${{ steps.decide.outputs.said }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Only the files a run loads of the defense, nothing else of the base commit.
      - name: Take the rules and sensor settings of the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            /lab/rules/
            /lab/sensors/
          sparse-checkout-cone-mode: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Decide
        id: decide
        run: '"$RUNNER_TEMP/venv/bin/bluefire-lab" pair --base base/lab lab | tee -a "$GITHUB_OUTPUT"'

      - name: Say what was decided
        env:
          SAID: ${{ steps.decide.outputs.said }}
        run: echo "$SAID" >> "$GITHUB_STEP_SUMMARY"

  loop:
    # The head's run keeps the name it always had; the base's says what it is.
    name: ${{ matrix.side == 'base' && 'attack tests on this runner, with the defense of the base commit' || 'attack tests on this runner' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    env:
      SIDE: ${{ matrix.side }}
      # Where the run takes the lab's own rules and the sensors' settings from.
      DEFENSE: ${{ matrix.side == 'base' && 'base/lab' || 'lab' }}
      # The commit those files are of: the run records it, and the report links the lab's rules there.
      DEFENSE_COMMIT: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Take the rules and sensor settings of the base commit
        if: matrix.side == 'base'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            /lab/rules/
            /lab/sensors/
          sparse-checkout-cone-mode: false

      - name: Install the sensor, the executor's dependency and the lab
        run: |
          echo "RUN=$RUNNER_TEMP/lab-run" >> "$GITHUB_ENV"
          # The journal must keep every record of the sensor: no rate limit.
          sudo install -d /etc/systemd/journald.conf.d
          printf '[Journal]\nRateLimitIntervalSec=0\nRateLimitBurst=0\n' | sudo tee /etc/systemd/journald.conf.d/bluefire-lab.conf
          sudo systemctl restart systemd-journald
          # needrestart would restart the sensor when a test's prerequisite installs a package.
          sudo apt-get remove -y -qq needrestart
          sudo apt-get update -qq
          sudo apt-get install -y -qq "sysmonforlinux=$SYSMON_VERSION" "sysinternalsebpf=$SYSINTERNALS_EBPF_VERSION" \
            "auditd=$AUDITD_VERSION"
          # The run exports auditd's current log file, so the log must not rotate during the run
          # (by default it does at 8 MB). auditd reads its configuration again on SIGHUP.
          sudo sed -i -e 's/^max_log_file = .*/max_log_file = 1024/' \
            -e 's/^max_log_file_action = .*/max_log_file_action = ignore/' /etc/audit/auditd.conf
          sudo grep -qx 'max_log_file_action = ignore' /etc/audit/auditd.conf
          sudo pkill -HUP -x auditd
          sudo pwsh -NoLogo -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module powershell-yaml -RequiredVersion $POWERSHELL_YAML_VERSION -Scope AllUsers -Force"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Fetch the pinned tests, executor, rules and rule engine
        run: |
          sudo install -d -o "$USER" /opt/bluefire-lab
          fetch() {
            git init -q "$2"
            git -C "$2" remote add origin "https://github.com/${1%@*}"
            git -C "$2" fetch -q --depth 1 --filter=blob:none origin "${1#*@}"
          }
          fetch "$INVOKE_ATOMICREDTEAM" /opt/bluefire-lab/invoke-atomicredteam
          git -C /opt/bluefire-lab/invoke-atomicredteam checkout -q FETCH_HEAD
          fetch "$ATOMIC_RED_TEAM" /opt/bluefire-lab/atomic-red-team
          # Only the folders of the techniques on the list are checked out.
          grep -o 'technique: T[0-9.]*' lab/pinned-tests.yaml | cut -d' ' -f2 | sort -u \
            | while read -r technique; do echo "atomics/$technique"; done \
            | git -C /opt/bluefire-lab/atomic-red-team sparse-checkout set --stdin
          git -C /opt/bluefire-lab/atomic-red-team checkout -q FETCH_HEAD
          # Upstream's index of its Linux tests names each test's tactic. That one file is taken by
          # itself: a sparse checkout of its folder would also bring the files of the folder above
          # it, 54 MB of other indexes.
          index=atomics/Indexes/Indexes-CSV/linux-index.csv
          mkdir -p "/opt/bluefire-lab/atomic-red-team/${index%/*}"
          git -C /opt/bluefire-lab/atomic-red-team show "HEAD:$index" \
            > "/opt/bluefire-lab/atomic-red-team/$index"
          fetch "$SIGMA" /opt/bluefire-lab/sigma
          git -C /opt/bluefire-lab/sigma sparse-checkout set rules/linux
          git -C /opt/bluefire-lab/sigma checkout -q FETCH_HEAD
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zircolite.zip" "$ZIRCOLITE_URL"
          echo "${ZIRCOLITE_DIGEST#sha256:}  $RUNNER_TEMP/zircolite.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/zircolite.zip" -d /opt/bluefire-lab/zircolite
          # The rules the run used travel with its results.
          mkdir -p "$RUN/rules"
          cp -r /opt/bluefire-lab/sigma/rules/linux "$RUN/rules/linux"
          cp /opt/bluefire-lab/sigma/LICENSE "$RUN/rules/LICENSE"
          echo "${SIGMA%@*}@$(git -C /opt/bluefire-lab/sigma rev-parse HEAD)" > "$RUN/rules/SOURCE"
          # The lab's own rules travel beside them, apart, so that the report can tell them apart.
          mkdir -p "$RUN/lab-rules"
          cp -r "$DEFENSE/rules/linux" "$RUN/lab-rules/linux"

      - name: Create the test account and reject its outbound traffic
        run: |
          sudo useradd --create-home --shell /bin/bash bluefire-lab
          for tables in iptables ip6tables; do
            sudo "$tables" -I OUTPUT ! -o lo -m owner --uid-owner bluefire-lab -j REJECT
            # The local resolver would otherwise look names up for the account.
            for protocol in udp tcp; do
              sudo "$tables" -I OUTPUT -o lo -p "$protocol" --dport 53 -m owner --uid-owner bluefire-lab -j REJECT
            done
          done
          if sudo -u bluefire-lab curl -sS --max-time 5 -o /dev/null https://github.com; then
            echo "the test account still reaches the network"
            exit 1
          fi
          if sudo -u bluefire-lab getent hosts github.com; then
            echo "the test account can still look up names"
            exit 1
          fi
          # The check above stops at the name, so this one gives the account the address itself.
          address=$(getent ahostsv4 github.com | head -n 1 | cut -d' ' -f1)
          test -n "$address"
          # The same request from the runner's own account must work, or the check shows nothing.
          curl -sS --max-time 10 -o /dev/null --resolve "github.com:443:$address" https://github.com
          if sudo -u bluefire-lab curl -sS --max-time 5 -o /dev/null --resolve "github.com:443:$address" \
            https://github.com; then
            echo "the test account still reaches $address"
            exit 1
          fi

      - name: Keep the lab's own files out of the test account's reach
        run: |
          # The tests, the executor, the rules and the rule engine, the lab and the run's folder.
          # A test run as the account must not change what a later test runs, or the evaluation.
          # What the steps before this one fetched comes out writable by every account.
          sudo chmod -R go-w /opt/bluefire-lab "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          writable=$(sudo -u bluefire-lab find /opt/bluefire-lab "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -writable 2>/dev/null | head -n 20 || true)
          if [ -n "$writable" ]; then
            echo "the test account can write to these files of the lab's own, among others:"
            echo "$writable"
            exit 1
          fi

      - name: Stop the runner's own timers
        run: |
          # A unit that a timer starts inside the window of a test run as root would count as the test's.
          timers=$(systemctl list-units --type=timer --state=active --no-legend --plain | awk '{ print $1 }')
          if [ -n "$timers" ]; then sudo systemctl stop $timers; fi
          echo "stopped:" $timers

      - name: Run the tests
        run: |
          # So that what the run writes while the tests run is not theirs to change.
          umask 022
          "$RUNNER_TEMP/venv/bin/bluefire-lab" run \
            --tests lab/pinned-tests.yaml \
            --atomics /opt/bluefire-lab/atomic-red-team/atomics \
            --executor /opt/bluefire-lab/invoke-atomicredteam \
            --sensor-config "$DEFENSE/sensors/sysmon.xml" \
            --audit-rules "$DEFENSE/sensors/audit.rules" \
            --out "$RUN"

      - name: Evaluate the rules and compute the answers
        if: always()
        run: |
          engine=$(find /opt/bluefire-lab/zircolite -maxdepth 2 -type f -name Zircolite)
          "$RUNNER_TEMP/venv/bin/bluefire-lab" evaluate "$RUN" --engine "$engine"

      - name: Write the report
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" report "$RUN"
          if [ "$SIDE" = base ]; then
            echo "This run loaded the lab's own rules and the sensors' settings of the base commit, $DEFENSE_COMMIT." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUN/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -n $'\xe2\x80\x94' "$RUN/report.html" "$RUN/summary.md"; then echo "the report must not use the em dash"; exit 1; fi

      # The run as one file that can be replayed: its format is docs/RECORDING.md.
      - name: Write the recording
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" recording "$RUN" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The same run as one page that plays it in a browser: the app's page template, from this
      # checkout, with the recording inside. See docs/LIVE_VIEW.md.
      - name: Write the replay page
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" replay "$RUN/recording.json" \
            --template bluefire/ui/replay.html --out "$RUN/replay.html" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Take pictures of the report
        if: always()
        run: |
          # The top of the report, in each theme, at a size that fits a README: the summary, the
          # run's facts and the first rows of the table. The whole report is report.html.
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,1000 \
            --screenshot="$RUN/report-light.png" "file://$RUN/report.html"
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,1000 --force-dark-mode \
            --screenshot="$RUN/report-dark.png" "file://$RUN/report.html"

      - name: Refuse to publish telemetry that contains the job token
        if: always()
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          test -n "$JOB_TOKEN"
          if grep -r -l -F -e "$JOB_TOKEN" -e "$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)" "$RUN"; then
            rm -rf "$RUN"
            echo "the telemetry contains the job token: nothing is uploaded"
            exit 1
          fi

      # Last, so that nothing recorded after it could be missing from it.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.side == 'base' && 'lab-run-base' || 'lab-run' }}
          path: ${{ runner.temp }}/lab-run
          retention-days: 90
          if-no-files-found: error

  # Runs no test: it reads the two recordings of the pair, with the one change the plan declared.
  # A run that the first run's leftovers could have changed is no before or after, and the list ends
  # with tests whose changes upstream does not undo, so each side had a fresh runner of its own.
  pair:
    name: the change to the defense, before against after
    needs: [plan, loop]
    if: needs.plan.outputs.pair == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Download the run with the base commit's defense
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-run-base
          path: ${{ runner.temp }}/base

      - name: Download the run with the head's defense
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-run
          path: ${{ runner.temp }}/head

      # delta.md goes to the run page; the artifact lab-pair holds both recordings, delta.json and delta.md.
      - name: Compare
        env:
          CHANGE: ${{ needs.plan.outputs.change }}
          SAID: ${{ needs.plan.outputs.said }}
        run: |
          pair="$RUNNER_TEMP/pair"
          mkdir -p "$pair/before" "$pair/after"
          cp "$RUNNER_TEMP/base/recording.json" "$pair/before/recording.json"
          cp "$RUNNER_TEMP/head/recording.json" "$pair/after/recording.json"
          "$RUNNER_TEMP/venv/bin/bluefire-lab" compare "$pair/before/recording.json" "$pair/after/recording.json" \
            --out "$pair" --change "$CHANGE" --two-runners
          { echo "$SAID"; echo; cat "$pair/delta.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-pair
          path: ${{ runner.temp }}/pair
          retention-days: 90
          if-no-files-found: error

  # Only for a run without a pair: then it is the one comparison, across two runners and two days, and
  # it declares nothing, so whatever differs is named and a step that differs is run variation, not an
  # effect. Beside a pair it would be a second, weaker comparison that could be read as the result.
  compare:
    name: compare with the latest run on main
    needs: [plan, loop]
    if: needs.plan.outputs.pair != 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Download this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-run
          path: ${{ runner.temp }}/now

      - name: Download the latest successful run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow lab.yml --branch main --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' > "$RUNNER_TEMP/runs.txt"
          earlier=$(grep -v -x "$GITHUB_RUN_ID" "$RUNNER_TEMP/runs.txt" | head -n 1)
          echo "comparing with run $earlier"
          gh run download "$earlier" --repo "$GITHUB_REPOSITORY" --name lab-run --dir "$RUNNER_TEMP/before"

      # delta.md goes to the run page; delta.json, which later views draw, is the artifact lab-delta.
      - name: Compare
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" compare "$RUNNER_TEMP/before/recording.json" \
            "$RUNNER_TEMP/now/recording.json" --out "$RUNNER_TEMP/delta"
          cat "$RUNNER_TEMP/delta/delta.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-delta
          path: ${{ runner.temp }}/delta
          retention-days: 90
          if-no-files-found: error
