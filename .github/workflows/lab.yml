name: lab

# Runs published attack tests on a hosted runner, records what a sensor on the
# runner saw, has a rule engine evaluate pinned detection rules over those
# records, and publishes a report. The runner is thrown away after the job.
# The jobs hold no secrets and a read-only token.

on:
  pull_request:
    paths:
      - lab/**
      - .github/workflows/lab.yml
  push:
    branches: [main]
    paths:
      - lab/**
      - .github/workflows/lab.yml
  schedule:
    # Weekly, so that a recent run always exists.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SYSMON_VERSION: 1.6.0
  SYSINTERNALS_EBPF_VERSION: 2.3.0
  AUDITD_VERSION: 1:3.1.2-2.1ubuntu0.1
  POWERSHELL_YAML_VERSION: 0.4.12
  INVOKE_ATOMICREDTEAM: redcanaryco/invoke-atomicredteam@8af478bb9e4637df568ac1e596553b025b16cd1b
  ATOMIC_RED_TEAM: redcanaryco/atomic-red-team@a0e3f9bc69fed2fd711bd1f1aa87a40c33482fe6
  SIGMA: SigmaHQ/sigma@552f3fee420ef232a8e5790c4fae591847e32347
  ZIRCOLITE_URL: https://github.com/wagga40/Zircolite/releases/download/v4.7.1/Zircolite-4.7.1-linux-x64.zip
  ZIRCOLITE_DIGEST: sha256:f09d3ba377ef0bf4899bba71b63ffca38d714f71765a716e46ad3549da5e316a

jobs:
  package:
    name: lab package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: No em dash in what the lab writes
        run: if grep -rn --exclude-dir=fixtures $'\xe2\x80\x94' lab; then echo "write the sentence without the em dash"; exit 1; fi

      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e "lab[dev]"

      - name: Lint
        run: |
          "$RUNNER_TEMP/venv/bin/ruff" check lab
          "$RUNNER_TEMP/venv/bin/ruff" format --check lab

      - name: Test
        run: '"$RUNNER_TEMP/venv/bin/pytest" --rootdir lab -c lab/pyproject.toml lab/tests'

  loop:
    name: attack tests on this runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the sensor, the executor's dependency and the lab
        run: |
          echo "RUN=$RUNNER_TEMP/lab-run" >> "$GITHUB_ENV"
          # The journal must keep every record of the sensor: no rate limit.
          sudo install -d /etc/systemd/journald.conf.d
          printf '[Journal]\nRateLimitIntervalSec=0\nRateLimitBurst=0\n' | sudo tee /etc/systemd/journald.conf.d/bluefire-lab.conf
          sudo systemctl restart systemd-journald
          # needrestart would restart the sensor when a test's prerequisite installs a package.
          sudo apt-get remove -y -qq needrestart
          sudo apt-get update -qq
          sudo apt-get install -y -qq "sysmonforlinux=$SYSMON_VERSION" "sysinternalsebpf=$SYSINTERNALS_EBPF_VERSION" \
            "auditd=$AUDITD_VERSION"
          sudo pwsh -NoLogo -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module powershell-yaml -RequiredVersion $POWERSHELL_YAML_VERSION -Scope AllUsers -Force"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Fetch the pinned tests, executor, rules and rule engine
        run: |
          sudo install -d -o "$USER" /opt/bluefire-lab
          fetch() {
            git init -q "$2"
            git -C "$2" remote add origin "https://github.com/${1%@*}"
            git -C "$2" fetch -q --depth 1 --filter=blob:none origin "${1#*@}"
          }
          fetch "$INVOKE_ATOMICREDTEAM" /opt/bluefire-lab/invoke-atomicredteam
          git -C /opt/bluefire-lab/invoke-atomicredteam checkout -q FETCH_HEAD
          fetch "$ATOMIC_RED_TEAM" /opt/bluefire-lab/atomic-red-team
          # Only the folders of the techniques on the list are checked out.
          grep -o 'technique: T[0-9.]*' lab/pinned-tests.yaml | cut -d' ' -f2 | sort -u \
            | while read -r technique; do echo "atomics/$technique"; done \
            | git -C /opt/bluefire-lab/atomic-red-team sparse-checkout set --stdin
          git -C /opt/bluefire-lab/atomic-red-team checkout -q FETCH_HEAD
          fetch "$SIGMA" /opt/bluefire-lab/sigma
          git -C /opt/bluefire-lab/sigma sparse-checkout set rules/linux
          git -C /opt/bluefire-lab/sigma checkout -q FETCH_HEAD
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zircolite.zip" "$ZIRCOLITE_URL"
          echo "${ZIRCOLITE_DIGEST#sha256:}  $RUNNER_TEMP/zircolite.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/zircolite.zip" -d /opt/bluefire-lab/zircolite
          # The rules the run used travel with its results.
          mkdir -p "$RUN/rules"
          cp -r /opt/bluefire-lab/sigma/rules/linux "$RUN/rules/linux"
          cp /opt/bluefire-lab/sigma/LICENSE "$RUN/rules/LICENSE"
          echo "${SIGMA%@*}@$(git -C /opt/bluefire-lab/sigma rev-parse HEAD)" > "$RUN/rules/SOURCE"
          # The lab's own rules travel beside them, apart, so that the report can tell them apart.
          mkdir -p "$RUN/lab-rules"
          cp -r lab/rules/linux "$RUN/lab-rules/linux"

      - name: Create the test account and reject its outbound traffic
        run: |
          sudo useradd --create-home --shell /bin/bash bluefire-lab
          for tables in iptables ip6tables; do
            sudo "$tables" -I OUTPUT ! -o lo -m owner --uid-owner bluefire-lab -j REJECT
            # The local resolver would otherwise look names up for the account.
            for protocol in udp tcp; do
              sudo "$tables" -I OUTPUT -o lo -p "$protocol" --dport 53 -m owner --uid-owner bluefire-lab -j REJECT
            done
          done
          if sudo -u bluefire-lab curl -sS --max-time 5 -o /dev/null https://github.com; then
            echo "the test account still reaches the network"
            exit 1
          fi
          if sudo -u bluefire-lab getent hosts github.com; then
            echo "the test account can still look up names"
            exit 1
          fi

      - name: Stop the runner's own timers
        run: |
          # A unit that a timer starts inside the window of a test run as root would count as the test's.
          timers=$(systemctl list-units --type=timer --state=active --no-legend --plain | awk '{ print $1 }')
          if [ -n "$timers" ]; then sudo systemctl stop $timers; fi
          echo "stopped:" $timers

      - name: Run the tests
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" run \
            --tests lab/pinned-tests.yaml \
            --atomics /opt/bluefire-lab/atomic-red-team/atomics \
            --executor /opt/bluefire-lab/invoke-atomicredteam \
            --sensor-config lab/sensors/sysmon.xml \
            --audit-rules lab/sensors/audit.rules \
            --out "$RUN"

      - name: Evaluate the rules and compute the answers
        if: always()
        run: |
          engine=$(find /opt/bluefire-lab/zircolite -maxdepth 2 -type f -name Zircolite)
          "$RUNNER_TEMP/venv/bin/bluefire-lab" evaluate "$RUN" --engine "$engine"

      - name: Write the report
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" report "$RUN"
          cat "$RUN/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -n $'\xe2\x80\x94' "$RUN/report.html" "$RUN/summary.md"; then echo "the report must not use the em dash"; exit 1; fi

      - name: Take pictures of the report
        if: always()
        run: |
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,2600 \
            --screenshot="$RUN/report-light.png" "file://$RUN/report.html"
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,2600 --force-dark-mode \
            --screenshot="$RUN/report-dark.png" "file://$RUN/report.html"

      - name: Refuse to publish telemetry that contains the job token
        if: always()
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          test -n "$JOB_TOKEN"
          if grep -r -l -F -e "$JOB_TOKEN" -e "$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)" "$RUN"; then
            rm -rf "$RUN"
            echo "the telemetry contains the job token: nothing is uploaded"
            exit 1
          fi

      # Last, so that nothing recorded after it could be missing from it.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-run
          path: ${{ runner.temp }}/lab-run
          retention-days: 90
          if-no-files-found: error

  # Apart from the attack tests: this job only reads the two runs' results.
  compare:
    name: compare with the latest run on main
    needs: loop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Download this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-run
          path: ${{ runner.temp }}/now

      - name: Download the latest successful run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow lab.yml --branch main --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' > "$RUNNER_TEMP/runs.txt"
          earlier=$(grep -v -x "$GITHUB_RUN_ID" "$RUNNER_TEMP/runs.txt" | head -n 1)
          echo "comparing with run $earlier"
          gh run download "$earlier" --repo "$GITHUB_REPOSITORY" --name lab-run --dir "$RUNNER_TEMP/before"

      # On the run page and in the job's log, which is kept as long as the run's artifact.
      - name: Compare
        run: '"$RUNNER_TEMP/venv/bin/bluefire-lab" compare "$RUNNER_TEMP/before" "$RUNNER_TEMP/now" | tee -a "$GITHUB_STEP_SUMMARY"'
