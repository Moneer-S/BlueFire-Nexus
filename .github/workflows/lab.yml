name: lab

# Runs published attack tests on three hosted runners at once, records what the
# sensors on each runner saw, has a rule engine evaluate pinned detection rules
# over those records, and publishes a report of the answers the runners agree
# on. Each runner is thrown away after its job. The jobs hold no secrets and a
# read-only token.

on:
  pull_request:
    paths:
      - lab/**
      - .github/workflows/lab.yml
  push:
    branches: [main]
    paths:
      - lab/**
      - .github/workflows/lab.yml
  schedule:
    # Weekly, so that a recent run always exists.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      rules:
        description: >-
          Another Sigma rule set, evaluated as a column of its own: owner/repository@commit
          (the full 40-character commit), optionally followed by :folder
        required: false
        default: ""
      sysmon_config:
        description: >-
          A Sysmon for Linux configuration to test in place of the lab's own:
          owner/repository@commit:path/to/file.xml (the full 40-character commit)
        required: false
        default: ""
      audit_rules:
        description: >-
          Audit rules to test in place of the lab's own:
          owner/repository@commit:path/to/file.rules (the full 40-character commit)
        required: false
        default: ""
      image:
        description: >-
          A public container image to run the tests inside, in place of the runner itself:
          name@sha256:digest
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SYSMON_VERSION: 1.6.0
  SYSINTERNALS_EBPF_VERSION: 2.3.0
  AUDITD_VERSION: 1:3.1.2-2.1ubuntu0.1
  POWERSHELL_YAML_VERSION: 0.4.12
  INVOKE_ATOMICREDTEAM: redcanaryco/invoke-atomicredteam@8af478bb9e4637df568ac1e596553b025b16cd1b
  ATOMIC_RED_TEAM: redcanaryco/atomic-red-team@a0e3f9bc69fed2fd711bd1f1aa87a40c33482fe6
  SIGMA: SigmaHQ/sigma@552f3fee420ef232a8e5790c4fae591847e32347
  ZIRCOLITE_URL: https://github.com/wagga40/Zircolite/releases/download/v4.7.1/Zircolite-4.7.1-linux-x64.zip
  ZIRCOLITE_DIGEST: sha256:f09d3ba377ef0bf4899bba71b63ffca38d714f71765a716e46ad3549da5e316a
  # Ordinary activity that the lab's own rules must stay quiet on, written by others: packages
  # of Ubuntu's archive at the versions it serves that day, a published Ansible role and a
  # source release. The commands that use them are the baseline's parts in lab/pinned-tests.yaml.
  BASELINE_PACKAGES: vsftpd sysstat redis-server
  BASELINE_ROLE: geerlingguy/ansible-role-node_exporter@0df55616d72d9a2b22f6c670a74659f112f68b59
  BASELINE_SOURCE_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz
  BASELINE_SOURCE_DIGEST: sha256:71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af

jobs:
  package:
    name: lab package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: No em dash in what the lab writes
        run: if grep -rn --exclude-dir=fixtures $'\xe2\x80\x94' lab; then echo "write the sentence without the em dash"; exit 1; fi

      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e "lab[dev]"

      - name: Lint
        run: |
          "$RUNNER_TEMP/venv/bin/ruff" check lab
          "$RUNNER_TEMP/venv/bin/ruff" format --check lab

      - name: Test
        run: '"$RUNNER_TEMP/venv/bin/pytest" --rootdir lab -c lab/pyproject.toml lab/tests'

  # The same list on three runners at once. A sensor reports some events only sometimes, so an
  # answer counts only when all three runners give it: see the job "answers" below.
  loop:
    name: attack tests on runner ${{ matrix.runner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the sensor, the executor's dependency and the lab
        run: |
          echo "RUN=$RUNNER_TEMP/lab-run" >> "$GITHUB_ENV"
          # The journal must keep every record of the sensor: no rate limit.
          sudo install -d /etc/systemd/journald.conf.d
          printf '[Journal]\nRateLimitIntervalSec=0\nRateLimitBurst=0\n' | sudo tee /etc/systemd/journald.conf.d/bluefire-lab.conf
          sudo systemctl restart systemd-journald
          # needrestart would restart the sensor when a test's prerequisite installs a package.
          sudo apt-get remove -y -qq needrestart
          sudo apt-get update -qq
          sudo apt-get install -y -qq "sysmonforlinux=$SYSMON_VERSION" "sysinternalsebpf=$SYSINTERNALS_EBPF_VERSION" \
            "auditd=$AUDITD_VERSION"
          # The run exports auditd's current log file, so the log must not rotate during the run
          # (by default it does at 8 MB). auditd reads its configuration again on SIGHUP.
          sudo sed -i -e 's/^max_log_file = .*/max_log_file = 1024/' \
            -e 's/^max_log_file_action = .*/max_log_file_action = ignore/' /etc/audit/auditd.conf
          sudo grep -qx 'max_log_file_action = ignore' /etc/audit/auditd.conf
          sudo pkill -HUP -x auditd
          sudo pwsh -NoLogo -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module powershell-yaml -RequiredVersion $POWERSHELL_YAML_VERSION -Scope AllUsers -Force"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Fetch the pinned tests, executor, rules and rule engine
        run: |
          sudo install -d -o "$USER" /opt/bluefire-lab
          fetch() {
            git init -q "$2"
            git -C "$2" remote add origin "https://github.com/${1%@*}"
            git -C "$2" fetch -q --depth 1 --filter=blob:none origin "${1#*@}"
          }
          fetch "$INVOKE_ATOMICREDTEAM" /opt/bluefire-lab/invoke-atomicredteam
          git -C /opt/bluefire-lab/invoke-atomicredteam checkout -q FETCH_HEAD
          fetch "$ATOMIC_RED_TEAM" /opt/bluefire-lab/atomic-red-team
          # Only the folders of the techniques on the list are checked out.
          grep -o 'technique: T[0-9.]*' lab/pinned-tests.yaml | cut -d' ' -f2 | sort -u \
            | while read -r technique; do echo "atomics/$technique"; done \
            | git -C /opt/bluefire-lab/atomic-red-team sparse-checkout set --stdin
          git -C /opt/bluefire-lab/atomic-red-team checkout -q FETCH_HEAD
          fetch "$SIGMA" /opt/bluefire-lab/sigma
          git -C /opt/bluefire-lab/sigma sparse-checkout set rules/linux
          git -C /opt/bluefire-lab/sigma checkout -q FETCH_HEAD
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zircolite.zip" "$ZIRCOLITE_URL"
          echo "${ZIRCOLITE_DIGEST#sha256:}  $RUNNER_TEMP/zircolite.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/zircolite.zip" -d /opt/bluefire-lab/zircolite
          # What the baseline of ordinary activity installs, applies and builds.
          sudo apt-get install -y -qq --download-only $BASELINE_PACKAGES
          mkdir -p /opt/bluefire-lab/baseline/roles
          cp lab/baseline/node-exporter.yml /opt/bluefire-lab/baseline/
          fetch "$BASELINE_ROLE" /opt/bluefire-lab/baseline/roles/node_exporter
          git -C /opt/bluefire-lab/baseline/roles/node_exporter checkout -q FETCH_HEAD
          curl -fsSL --retry 3 -o /opt/bluefire-lab/baseline/jq.tar.gz "$BASELINE_SOURCE_URL"
          echo "${BASELINE_SOURCE_DIGEST#sha256:}  /opt/bluefire-lab/baseline/jq.tar.gz" | sha256sum --check
          # Where the runner image keeps Ansible is not in root's search path. A link would count as
          # a file of the lab's own that the test account can change, so this is a small script.
          printf '#!/bin/sh\nexec %s "$@"\n' "$(command -v ansible-playbook)" > /opt/bluefire-lab/baseline/ansible-playbook
          chmod 755 /opt/bluefire-lab/baseline/ansible-playbook
          ansible-playbook --version | head -n 1
          # The rules the run used travel with its results.
          mkdir -p "$RUN/rules"
          cp -r /opt/bluefire-lab/sigma/rules/linux "$RUN/rules/linux"
          cp /opt/bluefire-lab/sigma/LICENSE "$RUN/rules/LICENSE"
          echo "${SIGMA%@*}@$(git -C /opt/bluefire-lab/sigma rev-parse HEAD)" > "$RUN/rules/SOURCE"
          # The lab's own rules travel beside them, apart, so that the report can tell them apart.
          mkdir -p "$RUN/lab-rules"
          cp -r lab/rules/linux "$RUN/lab-rules/linux"

      # Only when the run was started by hand with the input "rules". The rule set is a public
      # repository's, at a commit: its YAML files travel with the run, with the licence files
      # found beside them, and the evaluation gives them a column of their own.
      - name: Fetch the rule set given as an input
        if: ${{ inputs.rules != '' }}
        env:
          RULE_SET: ${{ inputs.rules }}
        run: |
          if ! printf '%s\n' "$RULE_SET" | grep -Eqx '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}(:[A-Za-z0-9_./-]+)?'; then
            echo "the input rules is owner/repository@commit, with the full 40-character commit, optionally followed by :folder"
            exit 1
          fi
          case "$RULE_SET" in *..*) echo "the folder must not contain .."; exit 1 ;; esac
          repository=${RULE_SET%%@*}
          rest=${RULE_SET#*@}
          commit=${rest%%:*}
          folder=""
          case "$rest" in *:*) folder=${rest#*:} ;; esac
          git init -q /opt/bluefire-lab/rule-set
          git -C /opt/bluefire-lab/rule-set remote add origin "https://github.com/$repository"
          git -C /opt/bluefire-lab/rule-set fetch -q --depth 1 --filter=blob:none origin "$commit"
          if [ -n "$folder" ]; then git -C /opt/bluefire-lab/rule-set sparse-checkout set "$folder"; fi
          git -C /opt/bluefire-lab/rule-set checkout -q FETCH_HEAD
          test -d "/opt/bluefire-lab/rule-set/$folder" || { echo "the repository has no folder $folder at that commit"; exit 1; }
          mkdir -p "$RUN/rule-set/files"
          # The YAML files only, as files: a link in the repository is not followed.
          (cd "/opt/bluefire-lab/rule-set/$folder" && find . -path ./.git -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 -r cp --parents -P -t "$RUN/rule-set/files")
          find /opt/bluefire-lab/rule-set -maxdepth 1 -type f \( -iname 'LICEN[CS]E*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -exec cp -P {} "$RUN/rule-set/" \;
          echo "$RULE_SET" > "$RUN/rule-set/SOURCE"
          echo "rule files: $(find "$RUN/rule-set/files" -type f | wc -l)"

      # Only when the run was started by hand with the input "sysmon_config" or "audit_rules": each
      # is one file of a public repository at a commit. Every test but the known-detected one then
      # runs under these settings, with the lab's instrument rules loaded after them.
      - name: Fetch the sensor settings given as inputs
        if: ${{ inputs.sysmon_config != '' || inputs.audit_rules != '' }}
        env:
          SYSMON_CONFIG: ${{ inputs.sysmon_config }}
          AUDIT_RULES: ${{ inputs.audit_rules }}
        run: |
          mkdir -p "$RUNNER_TEMP/given-settings"
          fetch_file() {
            if ! printf '%s\n' "$1" | grep -Eqx '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}:[A-Za-z0-9_./-]+'; then
              echo "the input is owner/repository@commit:path/to/file, with the full 40-character commit: $1"
              exit 1
            fi
            case "$1" in *..*) echo "the path must not contain .."; exit 1 ;; esac
            repository=${1%%@*}
            rest=${1#*@}
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/given-settings/$2" \
              "https://raw.githubusercontent.com/$repository/${rest%%:*}/${rest#*:}"
            echo "$1" > "$RUNNER_TEMP/given-settings/${2%.*}.SOURCE"
          }
          if [ -n "$SYSMON_CONFIG" ]; then fetch_file "$SYSMON_CONFIG" sysmon.xml; fi
          if [ -n "$AUDIT_RULES" ]; then fetch_file "$AUDIT_RULES" audit.rules; fi
          ls -l "$RUNNER_TEMP/given-settings"

      # Only when the run was started by hand with the input "image". The image is pulled now,
      # by digest: once the container exists it has no way to fetch anything.
      - name: Pull the image given as an input
        if: ${{ inputs.image != '' }}
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if ! printf '%s\n' "$IMAGE" | grep -Eqx '[a-z0-9][a-z0-9._/:-]*@sha256:[0-9a-f]{64}'; then
            echo "the input image is name@sha256:digest, with the 64-character digest: $IMAGE"
            exit 1
          fi
          docker pull --quiet "$IMAGE"
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' "$IMAGE"

      - name: Create the test account and reject its outbound traffic
        run: |
          sudo useradd --create-home --shell /bin/bash bluefire-lab
          for tables in iptables ip6tables; do
            sudo "$tables" -I OUTPUT ! -o lo -m owner --uid-owner bluefire-lab -j REJECT
            # The local resolver would otherwise look names up for the account.
            for protocol in udp tcp; do
              sudo "$tables" -I OUTPUT -o lo -p "$protocol" --dport 53 -m owner --uid-owner bluefire-lab -j REJECT
            done
          done
          if sudo -u bluefire-lab curl -sS --max-time 5 -o /dev/null https://github.com; then
            echo "the test account still reaches the network"
            exit 1
          fi
          if sudo -u bluefire-lab getent hosts github.com; then
            echo "the test account can still look up names"
            exit 1
          fi
          # The check above stops at the name, so this one gives the account the address itself.
          address=$(getent ahostsv4 github.com | head -n 1 | cut -d' ' -f1)
          test -n "$address"
          # The same request from the runner's own account must work, or the check shows nothing.
          curl -sS --max-time 10 -o /dev/null --resolve "github.com:443:$address" https://github.com
          if sudo -u bluefire-lab curl -sS --max-time 5 -o /dev/null --resolve "github.com:443:$address" \
            https://github.com; then
            echo "the test account still reaches $address"
            exit 1
          fi

      - name: Keep the lab's own files out of the test account's reach
        run: |
          # The tests, the executor, the rules and the rule engine, the lab and the run's folder.
          # A test run as the account must not change what a later test runs, or the evaluation.
          # What the steps before this one fetched comes out writable by every account.
          sudo chmod -R go-w /opt/bluefire-lab "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          writable=$(sudo -u bluefire-lab find /opt/bluefire-lab "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -writable 2>/dev/null | head -n 20 || true)
          if [ -n "$writable" ]; then
            echo "the test account can write to these files of the lab's own, among others:"
            echo "$writable"
            exit 1
          fi

      - name: Stop the runner's own timers
        run: |
          # A unit that a timer starts inside the window of a test run as root would count as the test's.
          timers=$(systemctl list-units --type=timer --state=active --no-legend --plain | awk '{ print $1 }')
          if [ -n "$timers" ]; then sudo systemctl stop $timers; fi
          echo "stopped:" $timers

      - name: Run the tests
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # So that what the run writes while the tests run is not theirs to change.
          umask 022
          "$RUNNER_TEMP/venv/bin/bluefire-lab" run \
            ${IMAGE:+--image "$IMAGE"} \
            --tests lab/pinned-tests.yaml \
            --atomics /opt/bluefire-lab/atomic-red-team/atomics \
            --executor /opt/bluefire-lab/invoke-atomicredteam \
            --sensor-config lab/sensors/sysmon.xml \
            --audit-rules lab/sensors/audit.rules \
            --instrument lab/sensors/instrument.rules \
            --given-settings "$RUNNER_TEMP/given-settings" \
            --out "$RUN"

      - name: Evaluate the rules and compute the answers
        if: always()
        run: |
          engine=$(find /opt/bluefire-lab/zircolite -maxdepth 2 -type f -name Zircolite)
          "$RUNNER_TEMP/venv/bin/bluefire-lab" evaluate "$RUN" --engine "$engine"

      # This runner's own report. The run page gets the report of all three, from the job "answers".
      - name: Write the report
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/bluefire-lab" report "$RUN"'

      - name: Refuse to publish telemetry that contains the job token
        if: always()
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          test -n "$JOB_TOKEN"
          if grep -r -l -F -e "$JOB_TOKEN" -e "$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)" "$RUN"; then
            rm -rf "$RUN"
            echo "the telemetry contains the job token: nothing is uploaded"
            exit 1
          fi

      # Last, so that nothing recorded after it could be missing from it.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-run-${{ matrix.runner }}
          path: ${{ runner.temp }}/lab-run
          # The job "answers" uploads all three again as one artifact, which is the one to keep.
          retention-days: 5
          if-no-files-found: error

  # Only for a run with the input "image": shows that the check a container target must pass can
  # fail. A container of the same image, with nothing started in it by the lab and no test in the
  # job, is put on a network that has a route out, and the check must refuse it.
  leash:
    name: the check refuses a container with a route out
    if: ${{ inputs.image != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: A container on a network with a route out is refused
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker network create --label bluefire-lab=1 bluefire-lab-route-out
          docker run --detach --name bluefire-lab-route-out --label bluefire-lab=1 --network bluefire-lab-route-out "$IMAGE"
          if "$RUNNER_TEMP/venv/bin/bluefire-lab" leash bluefire-lab-route-out --network bluefire-lab-route-out | tee "$RUNNER_TEMP/leash.txt"; then
            echo "the check passed a container that has a route out"
            exit 1
          fi
          grep -q 'refused: the network bluefire-lab-route-out is not internal' "$RUNNER_TEMP/leash.txt"
          grep -q 'WRONG   from the container to an outside address over IPv4: succeeded' "$RUNNER_TEMP/leash.txt"
          docker rm --force bluefire-lab-route-out
          docker network rm bluefire-lab-route-out

  # Apart from the attack tests: this job only reads what the three runners uploaded. It gives
  # each test the answer all three runners gave, or marks the answer unstable.
  answers:
    name: answers of the three runners
    needs: loop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Download each runner's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-run-*
          path: ${{ runner.temp }}/lab-run

      - name: Combine the runners' answers
        run: |
          ls "$RUNNER_TEMP/lab-run"
          test "$(ls "$RUNNER_TEMP/lab-run" | wc -l)" = 3 || { echo "not all three runners uploaded their files"; exit 1; }
          "$RUNNER_TEMP/venv/bin/bluefire-lab" combine "$RUNNER_TEMP/lab-run"

      - name: Write the report
        if: always()
        env:
          GIVEN: ${{ inputs.rules }}${{ inputs.sysmon_config }}${{ inputs.audit_rules }}${{ inputs.image }}
        run: |
          "$RUNNER_TEMP/venv/bin/bluefire-lab" report "$RUNNER_TEMP/lab-run"
          cat "$RUNNER_TEMP/lab-run/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # The lab's own text uses no em dash. The text of rules or settings given as inputs is not the lab's.
          if [ -z "$GIVEN" ] && grep -n $'\xe2\x80\x94' "$RUNNER_TEMP/lab-run/report.html" "$RUNNER_TEMP/lab-run/summary.md"; then
            echo "the report must not use the em dash"
            exit 1
          fi

      - name: Take pictures of the report
        if: always()
        run: |
          # The top of the report, in each theme, at a size that fits a README: the summary, the
          # run's facts and the first rows of the table. The whole report is report.html.
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,1000 \
            --screenshot="$RUNNER_TEMP/lab-run/report-light.png" "file://$RUNNER_TEMP/lab-run/report.html"
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,1000 --force-dark-mode \
            --screenshot="$RUNNER_TEMP/lab-run/report-dark.png" "file://$RUNNER_TEMP/lab-run/report.html"

      # The three runners' files, each in a folder of its own, with the combined answers and report.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-run
          path: ${{ runner.temp }}/lab-run
          retention-days: 90
          if-no-files-found: error

  # Apart from the attack tests: this job only reads the two runs' results.
  compare:
    name: compare with the latest run on main
    needs: answers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the lab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./lab

      - name: Download this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-run
          path: ${{ runner.temp }}/now

      - name: Download the latest successful run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow lab.yml --branch main --status success \
            --limit 5 --json databaseId --jq '.[].databaseId' > "$RUNNER_TEMP/runs.txt"
          earlier=$(grep -v -x "$GITHUB_RUN_ID" "$RUNNER_TEMP/runs.txt" | head -n 1)
          echo "comparing with run $earlier"
          gh run download "$earlier" --repo "$GITHUB_REPOSITORY" --name lab-run --dir "$RUNNER_TEMP/before"

      # On the run page and in the job's log, which is kept as long as the run's artifact.
      - name: Compare
        run: '"$RUNNER_TEMP/venv/bin/bluefire-lab" compare "$RUNNER_TEMP/before" "$RUNNER_TEMP/now" | tee -a "$GITHUB_STEP_SUMMARY"'
