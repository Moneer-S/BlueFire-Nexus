name: Strix installed CLI startup qualification

on:
  workflow_dispatch:
    inputs:
      threat_review_ref:
        description: SHA-256 ref of the refreshed exact-candidate threat-review clearance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strix-runtime-admission-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact non-executed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_ref: ${{ steps.bundle.outputs.bundle_ref }}
    steps:
      - name: Checkout exact BlueFire revision without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          check-latest: false

      - name: Set up exact Go toolchain for the candidate build hook
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.10"
          cache: false

      - name: Set up exact uv frontend without a shared cache
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Require the operator's refreshed threat-review clearance ref
        shell: bash
        env:
          BLUEFIRE_REQUESTED_REVIEW_REF: ${{ inputs.threat_review_ref }}
          BLUEFIRE_APPROVED_REVIEW_REF: ${{ vars.STRIX_RUNTIME_ADMISSION_THREAT_REVIEW_REF }}
          BLUEFIRE_APPROVED_PREPARE_BACKENDS_REF: ${{ vars.STRIX_RUNTIME_ADMISSION_PREPARE_BACKENDS_REVIEW_REF }}
          BLUEFIRE_APPROVED_SOURCE_REVISION: ${{ vars.STRIX_RUNTIME_ADMISSION_SOURCE_REVISION }}
          BLUEFIRE_CURRENT_SOURCE_REVISION: ${{ github.sha }}
        run: >-
          python -c "import os,re,sys;
          requested=os.environ.get('BLUEFIRE_REQUESTED_REVIEW_REF','');
          approved=os.environ.get('BLUEFIRE_APPROVED_REVIEW_REF','');
          backends=os.environ.get('BLUEFIRE_APPROVED_PREPARE_BACKENDS_REF','');
          revision=os.environ.get('BLUEFIRE_CURRENT_SOURCE_REVISION','');
          approved_revision=os.environ.get('BLUEFIRE_APPROVED_SOURCE_REVISION','');
          sys.exit(0 if re.fullmatch(r'sha256:[0-9a-f]{64}',requested)
          and requested == approved and requested == backends
          and re.fullmatch(r'[0-9a-f]{40}',revision)
          and revision == approved_revision else 2)"

      - name: Build, prepare, and package inside a descendant-killing PID boundary
        id: bundle
        shell: bash
        run: |
          set -eu
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          stage_root="$RUNNER_TEMP/bluefire-strix-preparation-stage"
          test ! -e "$stage_root"
          mkdir -m 0700 "$stage_root"
          bundle_ref_output="$stage_root/bluefire-strix-admission-bundle-ref.txt"
          : > "$bundle_ref_output"
          chmod 0600 "$bundle_ref_output"
          sudo -n env -i PATH=/usr/bin:/bin \
            /usr/bin/unshare --mount --ipc --uts --pid --fork --kill-child=KILL --mount-proc \
            /bin/sh "$GITHUB_WORKSPACE/tools/strix_runtime_preparation_boundary.sh" \
            --outside "$GITHUB_WORKSPACE" "$stage_root" \
            "${{ env.pythonLocation }}/bin/python" "$PATH" "${{ github.sha }}" \
            "${{ inputs.threat_review_ref }}" "$bundle_ref_output" \
            "${{ github.run_id }}" "${{ github.run_attempt }}"
          test ! -e "$stage_root/bluefire-strix-preparation-boundary-home"
          sudo -n chown -R -h "$runner_uid:$runner_gid" "$stage_root"
          python -m tools.record_strix_runtime_admission_bundle_ref \
            --stage-root "$stage_root" \
            --reference-file "$bundle_ref_output" \
            --source-bundle \
            "$stage_root/bluefire-strix-admission-input-${{ github.run_id }}-${{ github.run_attempt }}.tar" \
            --trusted-bundle \
            "$RUNNER_TEMP/bluefire-strix-admission-input-${{ github.run_id }}-${{ github.run_attempt }}.tar" \
            --github-output "$GITHUB_OUTPUT"
          test ! -e "$stage_root"

      - name: Upload one immutable short-lived transfer file
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-runtime-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: >-
            ${{ runner.temp }}/bluefire-strix-admission-input-${{ github.run_id }}-${{ github.run_attempt }}.tar
          archive: false
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

  admit:
    name: Revalidate and probe on a fresh hosted runner
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact controller revision without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the exact probe interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          check-latest: false

      - name: Set up exact uv for controller-held lock export
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Initialize the exact cross-job installation layout
        shell: bash
        run: |
          set -eu
          test ! -e "$RUNNER_TEMP/bluefire-strix-preparation-stage"
          mkdir -m 0700 "$RUNNER_TEMP/bluefire-strix-preparation-stage"

      - name: Reconstruct the exact reviewed source before artifact download
        shell: bash
        run: >-
          python -m tools.reconstruct_strix_runtime_admission_source
          --work-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-source-work"
          --source-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-source-work/source"

      - name: Derive frozen requirements from the reviewed lock before artifact download
        shell: bash
        run: >-
          python -m tools.derive_strix_runtime_admission_requirements
          --source-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-source-work/source"
          --work-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-controller-inputs"
          --output-file
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-controller-inputs/strix-runtime-requirements.txt"

      - name: Download only the exact preparation artifact ID
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: >-
            ${{ runner.temp }}/bluefire-strix-preparation-stage/bluefire-strix-admission-download
          skip-decompress: true
          digest-mismatch: error

      - name: Bind service and inner bundle digests before privileged parsing
        shell: bash
        env:
          BLUEFIRE_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          BLUEFIRE_BUNDLE_REF: ${{ needs.prepare.outputs.bundle_ref }}
        run: >-
          python -c "import os,re,sys;
          digest=os.environ.get('BLUEFIRE_ARTIFACT_DIGEST','');
          ref=os.environ.get('BLUEFIRE_BUNDLE_REF','');
          sys.exit(0 if re.fullmatch(r'[0-9a-f]{64}',digest)
          and ref == 'sha256:'+digest else 2)"

      - name: Seal the exact stage parent for dropped-identity traversal
        shell: bash
        run: |
          set -eu
          stage="$RUNNER_TEMP/bluefire-strix-preparation-stage"
          sudo -n chown 0:0 "$stage"
          sudo -n chmod 0711 "$stage"
          test "$(stat -c '%u:%g:%a' "$stage")" = "0:0:711"

      - name: Revalidate and qualify only fixed installed CLI startup
        shell: bash
        run: >-
          sudo -n /usr/bin/unshare --net --fork -- /usr/bin/env -i
          PATH="${{ env.pythonLocation }}/bin:/usr/bin:/bin"
          HOME=/nonexistent
          PYTHONPATH="$GITHUB_WORKSPACE"
          PYTHONNOUSERSITE=1
          PYTHONSAFEPATH=1
          PYTHONDONTWRITEBYTECODE=1
          LC_ALL=C.UTF-8
          LANG=C.UTF-8
          BLUEFIRE_IMAGE_OS="$ImageOS"
          BLUEFIRE_IMAGE_VERSION="$ImageVersion"
          "${{ env.pythonLocation }}/bin/python" -P
          -m tools.qualify_strix_runtime_admission
          --input-bundle
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-download/bluefire-strix-admission-input-${{ github.run_id }}-${{ github.run_attempt }}.tar"
          --expected-bundle-ref "${{ needs.prepare.outputs.bundle_ref }}"
          --transfer-root "$RUNNER_TEMP/bluefire-strix-preparation-stage"
          --source-work-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-source-work"
          --source-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-source-work/source"
          --controller-requirements
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-controller-inputs/strix-runtime-requirements.txt"
          --output-root
          "$RUNNER_TEMP/bluefire-strix-preparation-stage/bluefire-strix-admission-output"
          --bluefire-source-revision "${{ github.sha }}"
          --threat-review-ref "${{ inputs.threat_review_ref }}"

      - name: Upload short-lived exact admission receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-runtime-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: >-
            ${{ runner.temp }}/bluefire-strix-preparation-stage/bluefire-strix-admission-output
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

      - name: Remove the owned fresh-runner admission stage
        if: always()
        shell: bash
        run: |
          set -eu
          stage="$RUNNER_TEMP/bluefire-strix-preparation-stage"
          case "$stage" in
            "$RUNNER_TEMP"/bluefire-strix-preparation-stage) ;;
            *) exit 2 ;;
          esac
          sudo -n rm -rf -- "$stage"
          test ! -e "$stage"
