# A small range for the tests, never run: a Wazuh manager, a host with one of
# each plant, a database and a stand-in internet that serves one published file.
# Its lock is for the stand-in contents the tests give for the published files,
# at a stand-in commit.
range: small
version: 1
prefix: bluefire-lab-sm
docker: {min_engine: 28}
atomic_red_team:
  repo: redcanaryco/atomic-red-team
  commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  lock: small.lock
base:
  image: ubuntu:noble-20261110.1@sha256:882e1e56091c9ffbc70c026ff5935fe85d3c91ad155917865ba2ffa23ede1560
  apt_snapshot: "20261120T000000Z"
defense:
  wazuh:
    manager_image: wazuh/wazuh-manager:4.14.10@sha256:eabfa7ee4e63acb51c2130fa0583e30f843d030b091cf45a4fbd93d78fa21517
    agent_deb:
      version: 4.14.10-1
      sha512: 5ee41846e81b2f5f5017bb0f968ac039443f09a400e5feb8121a4e52db6bb8d1c91683667b03a657a0236c858bd1f159026b493ace504ec8f92e491e6c8ae04d  # pragma: allowlist secret
    alert_level: 12
    off: [command_monitoring, sca, rootcheck, syscollector]
  watch:
    logs:
      - {path: /var/log/auth.log, format: syslog}
      - {path: /var/log/snoopy.log, format: syslog}
      - {path: /var/log/dpkg.log, format: syslog}
    fim_realtime: [/etc, /home, /root, /tmp, /var/tmp]
networks:
  lan: {}
  mgmt: {}
hosts:
  manager:
    kind: defense
    role: Wazuh manager
    networks: [mgmt]
    listens: [1514, 1515]
  web:
    kind: host
    role: a host with one of each plant
    networks: [lan, mgmt]
    packages: [openssh-server, openssh-client, sudo, php-mysql]
    services: [sshd]
    listens: [22]
    sshd: {password_auth: true, permit_root: false, pam_nodelay: true}
    accounts:
      - {name: admin, password: admin, shell: /bin/bash, sudo: [/usr/bin/id],  # pragma: allowlist secret
         listed: {file: "atomic:T1110.004/src/credstuffuserpass.txt", line: 2}}
      - {name: app, shell: /bin/sh}
    keys: [{name: deploy, type: rsa, private: admin@web, authorized: app@web}]
    known_hosts: [{account: admin, hosts: [web]}]
    dirs: [{path: /srv/drop, owner: app, mode: "0750"}]
    files:
      - {path: /etc/app/secret.env, owner: root, group: app, mode: "0640", text: "TOKEN=small-range-token"}
      - {path: /srv/app/page.txt, from: page.txt}
    atomics_src: [T1110.004]
  db:
    kind: host
    role: a database
    networks: [lan, mgmt]
    packages: [mariadb-server]
    services: [mariadb]
    listens: [3306]
    database: {name: store, user: store, password: Store-Db-1, from: "%",  # pragma: allowlist secret
               bind_address: 0.0.0.0, log_error: /var/log/mysql/error.log}
  inet:
    kind: internet
    role: the stand-in internet
    networks: [lan]
    packages: [python3]
    services: [inet-server]
    listens: [80, 443]
    serve: {"/files/hello.sh": "atomic:T1105/src/atomic.sh"}
    agent: false
