# The tests the lab runs, in this order. Each is a published Atomic Red Team
# test, pinned by its GUID at the commit named in .github/workflows/lab.yml.
# The lab checks every name against upstream before it starts.
#
# How the lab learns whether the technique took effect, in order of preference:
#   effect   One command, run as root after the test and before its cleanup.
#            Exit status 0 means it took effect.
#   output   A text that the test prints only when it took effect.
#   Without either, the test's own exit status decides.
# Other keys:
#   prepare  One command, run as the account the test runs as, that puts in
#            place what the test acts on. When it fails, the test is not
#            attempted.
#   args     Input arguments of the test to override.
#   dwell    Seconds to wait before the test's window closes, for what the
#            test schedules to run later.
#   defenses Hardening changes, named under "defenses" below. After all tests
#            have run, the test runs again once with each change in place.
#   variants Runs of the same test with changed input arguments, after the
#            hardened runs. Each gives "args" and, where the change moves what
#            the test leaves behind, its own "effect" and "prepare". A rule of
#            the lab's own is accepted only when it alerts on these as well.
#   needs    Programs the test needs on the target. The run takes an
#            inventory of the target first, and a test whose program is not
#            there is dropped, with the reason in the report.
# In effect and defense commands, {home} and {account} stand for the home
# folder and the name of the account the tests run as.
#
# A test belongs here when it acts only on the machine it runs on. Left out are
# tests that read other processes' memory or environment, search the file
# system for secrets, contact other hosts, send data out, reboot, change the
# firewall or the network, or would stop the sensor or the job.
#
# Do not swap a test out to change the table. A test that was tried and then
# left out goes under "dropped" with the reason, and the report lists it.

# Runs first and last. The pinned rules are known to catch it: a run in which
# it raises no alert has a broken pipeline and fails.
canary:
  technique: T1070.003
  guid: a934276e-2be5-4a36-93fd-98adbb5bd4fc
  name: Clear Bash history (rm)
  prepare: echo "ls -la" >> ~/.bash_history
  effect: test ! -e {home}/.bash_history
  rule: 1182f3b3-e716-4efa-99ab-d2685d04360f # History File Deletion, level high

# A harmless command through the same executor. A run in which it raises an
# alert fails.
control:
  technique: T1082
  guid: 486e88ea-4f56-470f-9b57-3f4d73f39133
  name: Hostname Discovery

# Ordinary administration, not an attack test, run after the control: once as
# root and once as the test account. It uses the tools and files the lab's own
# rules look at, the way ordinary work does. A rule of the lab's own that
# matches any of it is not accepted.
baseline:
  name: Ordinary administration with the tools the lab's rules look at
  root: |
    useradd --system --no-create-home --shell /usr/sbin/nologin bluefire-lab-service
    userdel bluefire-lab-service
    useradd --no-create-home --shell /bin/bash bluefire-lab-person
    userdel bluefire-lab-person
    mkdir -p /etc/systemd/system/cron.service.d
    printf '[Service]\nNice=5\n' > /etc/systemd/system/cron.service.d/bluefire-lab.conf
    systemctl daemon-reload
    rm /etc/systemd/system/cron.service.d/bluefire-lab.conf
    rmdir --ignore-fail-on-non-empty /etc/systemd/system/cron.service.d
    ln -sf /dev/null /etc/systemd/system/bluefire-lab-masked.service
    rm /etc/systemd/system/bluefire-lab-masked.service
    systemctl daemon-reload
    cp /usr/lib/systemd/system/cron.service /etc/systemd/system/bluefire-lab-copy.service
    systemctl daemon-reload
    rm /etc/systemd/system/bluefire-lab-copy.service
    systemctl daemon-reload
    useradd -rM -s /usr/sbin/nologin bluefire-lab-system
    userdel bluefire-lab-system
    install -m 755 /bin/true /usr/local/bin/bluefire-lab-tool
    chmod 750 /usr/local/bin/bluefire-lab-tool
    chmod u+x /usr/local/bin/bluefire-lab-tool
    chmod u+rwx,g+rx,o-rwx /usr/local/bin/bluefire-lab-tool
    chmod 0755 /usr/local/bin/bluefire-lab-tool
    rm /usr/local/bin/bluefire-lab-tool
    truncate -s 0 /var/log/bluefire-lab-baseline.log
    rm /var/log/bluefire-lab-baseline.log
    crontab -l || true
  account: |
    crontab -l || true
    echo ls >> ~/.bash_history
    chmod 600 ~/.bash_history
    cp ~/.bash_history ~/.bash_history.bak
    rm ~/.bash_history.bak
    truncate -s 0 ~/notes.txt
    rm ~/notes.txt
    truncate -s 1M ~/scratch.img
    rm ~/scratch.img
    cp /bin/true /tmp/bluefire-lab-build-step
    /tmp/bluefire-lab-build-step
    rm /tmp/bluefire-lab-build-step

