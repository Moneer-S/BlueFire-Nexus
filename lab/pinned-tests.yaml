# The tests the lab runs, in this order. Each is a published Atomic Red Team
# test, pinned by its GUID at the commit named in .github/workflows/lab.yml.
# The lab checks every name against upstream before it starts.
#
# How the lab learns whether the technique took effect, in order of preference:
#   effect   One command, run as root after the test and before its cleanup.
#            Exit status 0 means it took effect.
#   output   A text that the test prints only when it took effect.
#   Without either, the test's own exit status decides.
#   The effect command also runs before the test. If it finds the effect then,
#   the test did not cause it, and the answer is inconclusive.
# How the lab learns whether the test's cleanup undid what the test did:
#   leftover One command, run as root after the cleanup. Exit status 0 means
#            that something of the test is still there. Without it the effect
#            command is used. A test with neither only prints, and has nothing
#            to look for. A test that is left behind is listed in the report.
# What a test's telemetry is worth, written by hand for each test from the
# events a run on a hosted runner recorded for it:
#   shows_technique  true when the events of the test, its launcher line aside,
#            show the technique itself: the command with the arguments that
#            make it the technique, or the file it writes. Then a test that
#            raises no alert is a gap a rule could close. false when the events
#            show only what happened beside the technique, with the reason in
#            a comment: then no rule could close the gap without matching the
#            test's own text, and the sensor has to record more first. The
#            judgment holds for the lab's own sensor settings.
# Other keys:
#   prepare  One command, run as the account the test runs as, that puts in
#            place what the test acts on. When it fails, the test is not
#            attempted.
#   args     Input arguments of the test to override.
#   dwell    Seconds to wait before the test's window closes, for what the
#            test schedules to run later.
#   defenses Hardening changes, named under "defenses" below. After all tests
#            have run, the test runs again once with each change in place.
#   variants Runs of the same test with changed input arguments, after the
#            hardened runs. Each gives "args" and, where the change moves what
#            the test leaves behind, its own "effect" and "prepare". A rule of
#            the lab's own is accepted only when it alerts on these as well.
#   needs    Programs the test needs on the target, as a list. The run takes
#            an inventory of the target first, and a test whose program is
#            not there is left out, with the reason in the report. The lab
#            itself needs systemctl and ss, and the job uses useradd and awk
#            before the run, so those never leave a test out where it runs.
# In effect and defense commands, {home} and {account} stand for the home
# folder and the name of the account the tests run as.
#
# A test belongs here when it acts only on the machine it runs on. Left out are
# tests that read or write the memory or environment of a process they did not
# start, search the file system for secrets, contact other hosts, send data
# out, reboot, change the firewall or the network, or would stop the sensor or
# the job. A search for secrets stays when its input arguments limit it to the
# test account's home, where the lab plants what it looks for ("args" and
# "prepare" below).
#
# Do not swap a test out to change the table. A test that was tried and then
# left out goes under "dropped" with the reason, and the report lists it.

# Runs first and last. The pinned rules are known to catch it: a run in which
# it raises no alert has a broken pipeline and fails.
canary:
  technique: T1070.003
  guid: a934276e-2be5-4a36-93fd-98adbb5bd4fc
  name: Clear Bash history (rm)
  prepare: echo "ls -la" >> ~/.bash_history
  effect: test ! -e {home}/.bash_history
  rule: 1182f3b3-e716-4efa-99ab-d2685d04360f # History File Deletion, level high

# A harmless command through the same executor. A run in which it raises an
# alert fails.
control:
  technique: T1082
  guid: 486e88ea-4f56-470f-9b57-3f4d73f39133
  name: Hostname Discovery

# Ordinary activity, not an attack test, run after the control. A rule of the
# lab's own that matches any of it is not accepted. Each part runs as root or as
# the test account, in an audit session of its own, and says who wrote what it
# runs: a rule's author can only write ordinary work the rule was already
# written around, so most of the baseline is other people's work. What a part
# needs from the network is fetched by the workflow before the run, at the
# versions it pins. A part that does not run to its end (exit status 0) leaves
# every rule unaccepted: a rule is not judged quiet on work that did not happen.
baseline:
  name: Ordinary activity the lab's rules must stay quiet on
  parts:
    # The first two parts are this repository's own: ordinary use of the very
    # tools and files the lab's rules look at.
    - name: root
      as: root
      author: this repository
      what: ordinary administration as root with the tools the lab's rules look at
      run: |
        useradd --system --no-create-home --shell /usr/sbin/nologin bluefire-lab-service
        userdel bluefire-lab-service
        useradd --no-create-home --shell /bin/bash bluefire-lab-person
        userdel bluefire-lab-person
        mkdir -p /etc/systemd/system/cron.service.d
        printf '[Service]\nNice=5\n' > /etc/systemd/system/cron.service.d/bluefire-lab.conf
        systemctl daemon-reload
        rm /etc/systemd/system/cron.service.d/bluefire-lab.conf
        rmdir --ignore-fail-on-non-empty /etc/systemd/system/cron.service.d
        ln -sf /dev/null /etc/systemd/system/bluefire-lab-masked.service
        rm /etc/systemd/system/bluefire-lab-masked.service
        systemctl daemon-reload
        cp /usr/lib/systemd/system/cron.service /etc/systemd/system/bluefire-lab-copy.service
        systemctl daemon-reload
        rm /etc/systemd/system/bluefire-lab-copy.service
        systemctl daemon-reload
        useradd -rM -s /usr/sbin/nologin bluefire-lab-system
        userdel bluefire-lab-system
        install -m 755 /bin/true /usr/local/bin/bluefire-lab-tool
        chmod 750 /usr/local/bin/bluefire-lab-tool
        chmod u+x /usr/local/bin/bluefire-lab-tool
        chmod u+rwx,g+rx,o-rwx /usr/local/bin/bluefire-lab-tool
        chmod 0755 /usr/local/bin/bluefire-lab-tool
        rm /usr/local/bin/bluefire-lab-tool
        truncate -s 0 /var/log/bluefire-lab-baseline.log
        rm /var/log/bluefire-lab-baseline.log
        crontab -l || true
    - name: account
      as: account
      author: this repository
      what: ordinary work of the test account with the same tools
      run: |
        crontab -l || true
        echo ls >> ~/.bash_history
        chmod 600 ~/.bash_history
        cp ~/.bash_history ~/.bash_history.bak
        rm ~/.bash_history.bak
        truncate -s 0 ~/notes.txt
        rm ~/notes.txt
        truncate -s 1M ~/scratch.img
        rm ~/scratch.img
        cp /bin/true /tmp/bluefire-lab-build-step
        /tmp/bluefire-lab-build-step
        rm /tmp/bluefire-lab-build-step
        mkdir -p ~/.local/bin
        cp /bin/true ~/.local/bin/bluefire-lab-tool
        ~/.local/bin/bluefire-lab-tool
        rm ~/.local/bin/bluefire-lab-tool
        find ~ -name '*.txt' -type f
        find /etc -maxdepth 1 -name 'host*'
        echo notes > /tmp/bluefire-lab-notes.txt
        zip -q -j /tmp/bluefire-lab-notes.zip /tmp/bluefire-lab-notes.txt
        unzip -o -q /tmp/bluefire-lab-notes.zip -d /tmp/bluefire-lab-unzipped
        rm -r /tmp/bluefire-lab-notes.txt /tmp/bluefire-lab-notes.zip /tmp/bluefire-lab-unzipped
        site=$(python3 -c 'import site; print(site.getusersitepackages())')
        mkdir -p "$site"
        echo 'value = 1' > "$site/bluefire_lab_module.py"
        rm "$site/bluefire_lab_module.py"

tests:
  # Discovery
  - technique: T1082
    guid: cccb070c-df86-4216-a5bc-9fb60c74e27c
    name: List OS Information
    shows_technique: true
    effect: grep -q '^Linux ' /tmp/T1082.txt
  - technique: T1069.001
    guid: 952931a4-af0b-4335-bbbe-73c8c5b327ae
    name: Permission Groups Discovery (Local)
    shows_technique: true
    output: "root:x:0:"
  # ps prints this text also in its row for the test's own grep, so the check
  # shows that ps ran, not that other processes were visible to it.
  - technique: T1518.001
    guid: 23b91cd2-c99c-4002-9e41-317c63e024a2
    name: Security Software Discovery - ps (Linux)
    shows_technique: true
    output: "falcond|nessusd"
  # The listing stays in a file until the cleanup. The check passes only when the
  # account could see root's process 1.
  - technique: T1057
    guid: 4ff64f0b-aaf2-4866-b39d-38d9791407cc
    name: Process Discovery - ps
    shows_technique: true
    effect: grep -qE '^root +1 ' /tmp/loot.txt
  - technique: T1049
    guid: bcf05343-ef1d-4052-8a27-b00c9be42b9f
    name: System Network Connections Discovery via ss or lsof (Linux/MacOS)
    shows_technique: true
    needs: [ss]
    output: "Local Address:Port"
  - technique: T1083
    guid: 13c5e1ae-605b-46c4-a79f-db28c77ff24e
    name: Nix File and Directory Discovery 2
    shows_technique: true
    output: "./.bashrc"
    leftover: test -e /tmp/T1083.txt
  - technique: T1087.001
    guid: c955a599-3653-4fe5-b631-f11c00eb0397
    name: View accounts with UID 0
    shows_technique: true
    output: "root:x:0:0:"
    leftover: test -e /tmp/T1087.001.txt
  - technique: T1201
    guid: 7c86c55c-70fa-4a05-83c9-3aa19b145d1a
    name: Examine password expiration policy - All Linux
    shows_technique: true
    output: PASS_MAX_DAYS

  # Persistence
  # The effect is read from cron's spool: with /etc/cron.allow in place, crontab
  # refuses an account the file does not name even when root asks for it.
  - technique: T1053.003
    guid: 435057fb-74b1-410e-9403-d81baf194f75
    name: Cron - Replace crontab with referenced file
    shows_technique: true
    needs: [crontab]
    effect: grep -qF '/tmp/evil.sh' /var/spool/cron/crontabs/{account}
    dwell: 65 # long enough for cron to run the planted line once
    defenses: [cron-allow]
  # Root's own cron folder, which /etc/cron.allow does not cover. Upstream's default
  # command begins with echo, so the line the test writes there is not a cron entry and
  # cron schedules nothing from it: the test runs with a command that is one, and the
  # check reads a schedule and an account at the start of the line.
  - technique: T1053.003
    guid: 078e69eb-d9fb-450e-b9d0-2e118217c846
    name: Cron - Add script to /etc/cron.d folder
    shows_technique: true
    args: {command: "*/5 * * * * root echo bluefire-lab-cron-d"}
    effect: >-
      grep -qE '^[*0-9/,-]+( [*0-9/,-]+){4} root ' /etc/cron.d/persistevil
    defenses: [cron-allow]
  - technique: T1053.006
    guid: f4983098-bb13-44fb-9b2c-46149961807b
    name: Create Systemd Service and Timer
    shows_technique: true
    needs: [systemctl]
    effect: systemctl is-active --quiet art-timer.timer
    variants:
      - args:
          path_to_systemd_service: /etc/systemd/system/bluefire-lab-variant.service
          path_to_systemd_timer: /etc/systemd/system/bluefire-lab-variant.timer
          systemd_service_name: bluefire-lab-variant.service
          systemd_timer_name: bluefire-lab-variant.timer
        effect: systemctl is-active --quiet bluefire-lab-variant.timer
  - technique: T1543.002
    guid: d9e4f24f-aa67-4c6e-bcbf-85622b697a7c
    name: Create Systemd Service
    shows_technique: true
    needs: [systemctl]
    effect: systemctl is-enabled --quiet art-systemd-service.service && test -e /tmp/art-systemd-execstart-marker
    variants:
      - args:
          systemd_service_file: bluefire-lab-variant-service.service
          execstart_action: /bin/touch /var/tmp/bluefire-lab-variant-marker
        effect: >-
          systemctl is-enabled --quiet bluefire-lab-variant-service.service
          && test -e /var/tmp/bluefire-lab-variant-marker
  - technique: T1136.001
    guid: 40d8eabd-e394-46f6-8785-b9bfa1d011d2
    name: Create a user account on a Linux system
    shows_technique: true
    needs: [useradd]
    effect: getent passwd evil_user
    variants:
      - args: {username: bluefire_variant_user}
        effect: getent passwd bluefire_variant_user
  - technique: T1098.004
    guid: 342cc723-127c-4d3a-8292-9c0c6b4ecadc
    name: Modify SSH Authorized Keys
    # The rewrite of the keys file is the technique. Sysmon reports it only when the file looks
    # newly created afterwards, which it did in most runs and not in all.
    shows_technique: true
    # The test rewrites the file with the same content, so only its age shows that it did.
    prepare: >-
      install -d -m 700 ~/.ssh
      && echo "# planted by the lab, not a key" > ~/.ssh/authorized_keys
      && chmod 600 ~/.ssh/authorized_keys
      && touch -d "1 hour ago" ~/.ssh/authorized_keys
    effect: test -n "$(find {home}/.ssh/authorized_keys -newermt '30 minutes ago')"
    # The file's age cannot be undone. What can be left behind is other content.
    leftover: test "$(cat {home}/.ssh/authorized_keys)" != "# planted by the lab, not a key"
    defenses: [ssh-keys-root-owned]
  - technique: T1546.004
    guid: 0a898315-4cfa-4007-bafe-33a4646d115f
    name: Add command to .bashrc
    shows_technique: true
    effect: grep -q 'T1546.004' {home}/.bashrc
    defenses: [profile-immutable]
  # The account's other start files, which the immutable ~/.bashrc does not cover.
  # Upstream's cleanup keeps all but the last two lines of the file, one more than the
  # test adds, so each run also takes away the last line the account's file had before.
  - technique: T1546.004
    guid: 94500ae1-7e31-47e3-886b-c328da46872f
    name: Add command to .bash_profile
    shows_technique: true
    effect: grep -q 'T1546.004' {home}/.bash_profile
    defenses: [profile-immutable]
  - technique: T1546.004
    guid: bbdb06bc-bab6-4f5b-8232-ba3fbed51d77
    name: Append commands user shell profile
    shows_technique: true
    effect: grep -qF 'Atomic Red Team was here... T1546.004' {home}/.profile
    defenses: [profile-immutable]
  - technique: T1037.004
    guid: 126f71af-e1c9-405c-94ef-26a47b16c102
    name: rc.local
    shows_technique: true
    effect: test -x /etc/rc.local && grep -q aW1wb3J0IG9z /etc/rc.local
  - technique: T1546.005
    guid: a74b2e07-5952-4c03-8b56-56274b076b61
    name: Trap EXIT
    shows_technique: true
    effect: grep -qF 'thanks for all the fish' /tmp/art-fish.txt
  - technique: T1546.018
    guid: 6e78084a-a433-4702-a838-cc7b765d87e8
    name: Python Startup Hook - usercustomize.py (Linux / MacOS)
    # The hook file's creation is the technique. Sysmon reported it in all runs but one.
    shows_technique: true
    needs: [python3]
    effect: test -s /tmp/poc.txt && ls {home}/.local/lib/python3*/site-packages/usercustomize.py
    variants:
      - args: {python_exe: python3.12}
  # It writes the unit with a shell, so the lab's rule for that alerts on it too.
  - technique: T1569.003
    guid: 2fc6c0ab-4f88-4eb8-ab1b-f739fc22bba7
    name: Enable systemd Service for Persistence with Auto-Restart
    shows_technique: true
    needs: [systemctl]
    effect: systemctl is-enabled --quiet atomic-persist.service && grep -q persistent /tmp/atomic_persist_output.txt
    defenses: [tmp-noexec]
    variants:
      - args:
          service_name: bluefire-lab-variant-persist
          payload_path: /var/tmp/bluefire-lab-variant-payload.sh
        effect: >-
          systemctl is-enabled --quiet bluefire-lab-variant-persist.service
          && grep -q persistent /tmp/atomic_persist_output.txt
  # More services written with a shell, which the lab's rule for that should catch too.
  # Upstream writes each unit's line with echo "ExecStart=#{command_to_run}", and the
  # argument's own double quotes end that string early: the unit runs bash -c echo (or id)
  # without the redirect, which applies to the echo and leaves the output file empty. So
  # the checks read systemd's own line in the journal that the unit's command ran and ended
  # without error.
  - technique: T1569.003
    guid: e58c8723-5503-4533-b642-535cd20ec648
    name: Create and Enable a Malicious systemd Service Unit
    shows_technique: true
    needs: [systemctl, journalctl]
    effect: >-
      systemctl is-enabled --quiet atomic-test.service
      && journalctl -q --no-pager -o cat -u atomic-test.service | grep -q 'Deactivated successfully'
    variants:
      - args: {service_name: bluefire-lab-variant-unit}
        effect: >-
          systemctl is-enabled --quiet bluefire-lab-variant-unit.service
          && journalctl -q --no-pager -o cat -u bluefire-lab-variant-unit.service
          | grep -q 'Deactivated successfully'
  - technique: T1569.003
    guid: 6fec8560-ff64-4bbf-bc79-734fea48f7ca
    name: Masquerade Malicious Service as Legitimate System Service
    shows_technique: true
    needs: [systemctl, journalctl]
    effect: >-
      test -f /etc/systemd/system/systemd-network-helper.service
      && journalctl -q --no-pager -o cat -u systemd-network-helper.service | grep -q 'Deactivated successfully'
    variants:
      - args: {masquerade_name: systemd-bluefire-variant-helper}
        effect: >-
          test -f /etc/systemd/system/systemd-bluefire-variant-helper.service
          && journalctl -q --no-pager -o cat -u systemd-bluefire-variant-helper.service
          | grep -q 'Deactivated successfully'
  # A unit written outside systemd's folders and linked in: the lab's rule does not look there.
  # The journal keeps the unit's line after the cleanup, so what is looked for then is the
  # unit file and systemd's link to it.
  - technique: T1569.003
    guid: a1fa406e-2354-4a24-b6d6-94157e7564d4
    name: Create systemd Service Unit from /tmp (Unusual Location)
    shows_technique: true
    needs: [systemctl, journalctl]
    effect: journalctl -q --no-pager -o cat -u atomic_tmp.service | grep -q 'Deactivated successfully'
    leftover: test -e /tmp/atomic_tmp.service || test -L /etc/systemd/system/atomic_tmp.service
  - technique: T1556.003
    guid: 4b9dde80-ae22-44b1-a82a-644bf009eb9c
    name: Malicious PAM rule
    shows_technique: true
    effect: head -n 1 /etc/pam.d/su-l | grep -qF 'pam_succeed_if.so uid >= 0'
  - technique: T1078.003
    guid: d2b95631-62d7-45a3-aaef-0972cea97931
    name: Reactivate a locked/expired account (Linux)
    shows_technique: true
    needs: [useradd, usermod, openssl]
    # The account's password is unlocked and it no longer expires.
    effect: >-
      getent shadow art | awk -F: '$2 !~ /^!/ && $8 == 99999 { ok = 1 } END { exit !ok }'

  # Credential access, on files the lab plants in the test account's home only.
  # Before the history tests below, which leave ~/.bash_history a link to /dev/null.
  - technique: T1552.003
    guid: 3cfde62b-7c33-4b26-a61e-755d6131c8ce
    name: Search Through Bash History
    shows_technique: true
    prepare: echo 'sshpass -p bluefire-lab-planted ssh lab@bluefire-lab.invalid' >> ~/.bash_history
    effect: grep -qF 'bluefire-lab-planted' /tmp/loot.txt
  # Upstream searches from /; the search is limited to the account's home.
  - technique: T1552.004
    guid: 46959285-906d-40fa-9437-5a439accd878
    name: Discover Private SSH Keys
    shows_technique: true
    args: {search_path: "~"}
    prepare: >-
      install -d -m 700 ~/.ssh
      && echo 'bluefire-lab-planted, not a key' > ~/.ssh/id_rsa
      && chmod 600 ~/.ssh/id_rsa
    effect: grep -qF 'bluefire-lab-planted' /tmp/creds.txt
    variants:
      # Another kind of key, under its own name.
      - args: {search_path: "~", filename: id_ed25519}
        prepare: >-
          install -d -m 700 ~/.ssh
          && echo 'bluefire-lab-planted-variant, not a key' > ~/.ssh/id_ed25519
          && chmod 600 ~/.ssh/id_ed25519
        effect: grep -qF 'bluefire-lab-planted-variant' /tmp/creds.txt
  # Upstream searches from /, as above; the key is copied out instead of printed.
  - technique: T1552.004
    guid: 7c247dc7-5128-4643-907b-73a76d9135c3
    name: Copy Private SSH Keys with CP
    shows_technique: true
    args: {search_path: "~"}
    prepare: >-
      install -d -m 700 ~/.ssh
      && echo 'bluefire-lab-planted, not a key' > ~/.ssh/id_rsa
      && chmod 600 ~/.ssh/id_rsa
    effect: grep -qF 'bluefire-lab-planted' /tmp/art-staging{home}/.ssh/id_rsa
    variants:
      - args: {search_path: "~", output_folder: /tmp/bluefire-lab-variant-staging}
        effect: grep -qF 'bluefire-lab-planted' /tmp/bluefire-lab-variant-staging{home}/.ssh/id_rsa
  # Upstream searches from /; here the account's home, where the lab plants a file named
  # like a TLS key, which is not a key.
  - technique: T1552.004
    guid: 5e417277-0ae7-4ad5-a3e8-0fa27c122b29
    name: Find TLS private key files
    shows_technique: true
    args: {file_path: "~"}
    prepare: echo 'bluefire-lab-planted-tls, not a key' > ~/bluefire-lab-server.key
    effect: grep -qF 'bluefire-lab-planted-tls' /tmp/creds.txt

  # Permissions and masquerading
  - technique: T1222.002
    guid: 34ca1464-de9d-40c6-8c77-690adf36a135
    name: chmod - Change file or folder mode (numeric mode)
    shows_technique: true
    prepare: mkdir -p /tmp/AtomicRedTeam/atomics/T1222.002 && chmod 700 /tmp/AtomicRedTeam/atomics/T1222.002
    effect: test "$(stat -c %a /tmp/AtomicRedTeam/atomics/T1222.002)" = 755
  - technique: T1548.001
    guid: 759055b3-3885-4582-a8ec-c00c9d64dd79
    name: Set a SetUID flag on file
    shows_technique: true
    effect: test -u /tmp/evilBinary
    variants:
      - args: {file_to_setuid: /var/tmp/bluefire-lab-variant-binary}
        effect: test -u /var/tmp/bluefire-lab-variant-binary
  - technique: T1548.001
    guid: db55f666-7cba-46c6-9fe6-205a05c3242c
    name: Set a SetGID flag on file
    shows_technique: true
    effect: test -g /tmp/evilBinary
    variants:
      - args: {file_to_setuid: /var/tmp/bluefire-lab-variant-setgid}
        effect: test -g /var/tmp/bluefire-lab-variant-setgid
  # The same privilege by a file capability instead of the setuid bit.
  - technique: T1548.001
    guid: db53959c-207d-4000-9e7a-cd8eb417e072
    name: Make and modify capabilities of a binary
    shows_technique: true
    needs: [make, gcc, setcap, getcap]
    effect: getcap /tmp/cap | grep -q cap_setuid
  - technique: T1036.003
    guid: a315bfff-7a98-403b-b442-2ea1b255e556
    name: Masquerading as FreeBSD or Linux crond process.
    shows_technique: true
    # The test's last command is the renamed copy running "sleep 5", so its exit
    # status shows whether the copy ran. The copy itself is only preparation.
    leftover: test -e /tmp/crond
    defenses: [tmp-noexec]
  - technique: T1036.005
    guid: 812c3ab8-94b0-4698-a9bf-9420af23ce24
    name: Execute a process from a directory masquerading as the current parent directory
    shows_technique: true
    output: Hello from the Atomic Red Team test T1036.005
    leftover: test -e {home}/...
    variants:
