# Hardening changes a defender would deploy. The lab applies one as root after
# the test's preparation, runs the test, and removes the change after the
# test's cleanup. "apply" must fail when the change is not in place.
defenses:
  tmp-noexec:
    title: /tmp mounted with noexec, nosuid and nodev
    why: >-
      The CIS benchmarks for Ubuntu mount /tmp with these options, so that a
      program placed in /tmp cannot be started from there. A script in /tmp
      can still be run through an interpreter, as in sh /tmp/script.
    apply: >-
      mount --bind /tmp /tmp
      && mount -o remount,bind,noexec,nosuid,nodev /tmp
      && for option in noexec nosuid nodev; do findmnt -no OPTIONS /tmp | grep -qw "$option" || exit 1; done
    revert: umount -l /tmp
  cron-allow:
    title: crontab limited to root with /etc/cron.allow
    why: >-
      When /etc/cron.allow exists, only the accounts it names may use crontab.
      The CIS benchmarks for Ubuntu restrict crontab this way, with the file
      readable by crontab's group so that crontab can check it.
    apply: >-
      echo root > /etc/cron.allow
      && chown root:crontab /etc/cron.allow && chmod 640 /etc/cron.allow
    revert: rm -f /etc/cron.allow
  profile-immutable:
    title: the account's ~/.bashrc made immutable
    why: >-
      An immutable shell profile cannot be changed by its owner, so nothing can
      be planted in it to run at the account's next login.
    apply: chattr +i {home}/.bashrc && lsattr {home}/.bashrc | grep -q '^....i'
    revert: chattr -i {home}/.bashrc
  ssh-keys-root-owned:
    title: the account's ~/.ssh and authorized_keys owned by root
    why: >-
      With the folder and the keys file owned by root, the account cannot
      change the keys file in place, and sshd still accepts both. The account
      owns its home folder, so it could still move the folder aside and make a
      new one.
    apply: >-
      chown root:root {home}/.ssh {home}/.ssh/authorized_keys
      && chmod 755 {home}/.ssh && chmod 644 {home}/.ssh/authorized_keys
    revert: >-
      chown -R {account}:{account} {home}/.ssh
      && chmod 700 {home}/.ssh && chmod 600 {home}/.ssh/authorized_keys

