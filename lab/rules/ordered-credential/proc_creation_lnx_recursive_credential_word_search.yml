title: Recursive Credential Word Search In Application Or Configuration Trees
name: bluefire_recursive_secret_search
id: c8b27315-03f7-4da1-8b6b-d8348f556bdf
status: experimental
description: >-
  A grep-family program recursively searched an application or configuration
  tree for words commonly used in stored credentials. The atomic rule is an
  informational input to an ordered correlation rather than an alert alone.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: BlueFire lab
date: 2026-11-26
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - /grep
      - /egrep
      - /fgrep
  selection_recursive:
    CommandLine|contains:
      - ' -r'
      - ' -R'
      - ' --recursive'
  selection_word:
    CommandLine|contains:
      - password
      - passwd
      - secret
      - token
  selection_root:
    CommandLine|contains:
      - /var/www/
      - /srv/www/
      - /opt/
      - /etc/
  condition: all of selection_*
falsepositives:
  - An administrator auditing an application or configuration tree for stored credentials
level: informational
