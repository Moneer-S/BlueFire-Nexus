title: Credential Search Followed By Remote Archive Collection
name: bluefire_credential_hunt_then_remote_archive
id: cd5a0e6f-d3b5-42ec-bff3-a9a0a36365dd
status: experimental
description: >-
  A recursive credential-word search, an SSH private-key search, and a remote
  archive command over SSH occurred in that order on one computer under one
  recorded login within one minute. The post-run correlation is attributed to
  the remote archive command and retains all three evidence events.
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1552/004/
  - https://attack.mitre.org/techniques/T1560/001/
author: BlueFire lab
date: 2026-11-26
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1552.001
  - attack.t1552.004
  - attack.t1560.001
correlation:
  type: temporal_ordered
  rules:
    - bluefire_recursive_secret_search
    - bluefire_private_ssh_key_search
    - bluefire_remote_archive_over_ssh
  group-by:
    - Computer
    - User
  timespan: 1m
falsepositives:
  - An administrator auditing credentials immediately before a release, backup, or recovery task
level: high
