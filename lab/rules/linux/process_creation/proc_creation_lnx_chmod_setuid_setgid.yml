title: Setuid Or Setgid Bit Set With Chmod
id: da9308a5-985a-4094-b3f2-fe6f5437e1bb
status: experimental
description: >-
  chmod set the setuid or setgid bit on a file. A program with that bit runs
  with its owner's or group's rights, so setting it on a file one controls is a
  way to keep or raise rights. Packages set these bits when they install, not
  through chmod. The rule matches a symbolic mode that adds or sets s (u+s,
  g+xs, +s, a=rwxs, a part of u+x,g+s) and a numeric mode of four digits, or
  five with a leading 0, whose first digit sets either bit (4755, 2711, 04700).
references:
  - https://attack.mitre.org/techniques/T1548/001/
author: BlueFire lab
date: 2026-11-16
modified: 2026-11-17
tags:
  - attack.privilege-escalation
  - attack.t1548.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith: /chmod
  selection_symbolic:
    CommandLine|re: '(\s|,)[ugoa]*[+=][rwxXt]*s'
  selection_numeric:
    CommandLine|re: '\s0?[2-7][0-7]{3}(\s|$)'
  condition: selection_tool and (selection_symbolic or selection_numeric)
falsepositives:
  - An administrator installing a setuid program by hand
level: high
