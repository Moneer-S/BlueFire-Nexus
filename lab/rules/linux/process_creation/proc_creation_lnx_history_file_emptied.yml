title: Shell History File Emptied
id: 57b696b5-781a-469b-afff-4ed7a9cef80e
status: experimental
description: >-
  A shell history file was truncated to nothing or replaced by a link to
  /dev/null. Both keep the file in place and remove what it recorded, as
  covering tracks does.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: BlueFire lab
date: 2026-11-16
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_truncate:
    Image|endswith: /truncate
    CommandLine|contains:
      - '-s0'
      - '-s 0'
      - '--size=0'
      - '--size 0'
  selection_link:
    Image|endswith: /ln
    CommandLine|contains: /dev/null
  selection_history:
    CommandLine|contains:
      - _history
      - .history
  condition: (selection_truncate or selection_link) and selection_history
falsepositives:
  - Someone clearing their own history on purpose
level: high
