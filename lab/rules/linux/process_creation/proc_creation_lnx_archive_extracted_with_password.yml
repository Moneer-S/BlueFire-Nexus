title: Archive Extracted With A Password On The Command Line
id: 024051e3-ccf9-4147-9ca5-97fcdf3ead32
status: experimental
description: >-
  unzip or 7z extracted an archive with its password given on the command
  line (unzip -P, 7z -p followed by the password). A password protects an
  archive's content from scanners on the way in, which is how payloads are
  often delivered; an administrator unpacking an ordinary archive gives none.
references:
  - https://attack.mitre.org/techniques/T1027/013/
author: BlueFire lab
date: 2026-11-17
tags:
  - attack.defense-evasion
  - attack.t1027.013
logsource:
  product: linux
  category: process_creation
detection:
  selection_unzip:
    Image|endswith: /unzip
    CommandLine|contains: ' -P '
  selection_7z:
    Image|endswith:
      - /7z
      - /7za
      - /7zz
    CommandLine|re: '\s-p\S'
  condition: 1 of selection_*
falsepositives:
  - A script that unpacks a password-protected archive it was given on purpose
level: high
