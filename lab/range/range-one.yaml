# Range one: a small network of disposable containers, and the path of published
# tests that runs through it. The files that `from:` names are beside this file:
# app/ holds the shop's pages and its table, repos/ the build server's git
# repository. range-one.lock holds the SHA-256 of every file the hosts carry
# from Atomic Red Team, and range-one.rules.lock that of every file of the
# public rule sets. `activity` is the shop's ordinary work beside the path.
range: range-one
version: 1
sentence: >-
  An attacker on the internet guesses a weak SSH password on a shop's web
  server, looks around, finds a deploy key, uses it to pull the build server's
  configuration, and uploads it out over HTTPS, while Wazuh watches web, build and db.
prefix: bluefire-lab-r1            # every container, network and image name starts with it
docker: {min_engine: 28}
atomic_red_team:
  repo: redcanaryco/atomic-red-team
  commit: a0e3f9bc69fed2fd711bd1f1aa87a40c33482fe6  # pragma: allowlist secret
  lock: range-one.lock             # sha256 of every fetched technique YAML and src file
executor:
  reference: redcanaryco/invoke-atomicredteam
  commit: 8af478bb9e4637df568ac1e596553b025b16cd1b  # pragma: allowlist secret
base:
  image: ubuntu:noble-20261110.1@sha256:882e1e56091c9ffbc70c026ff5935fe85d3c91ad155917865ba2ffa23ede1560
  apt_snapshot: "20261120T000000Z"
defense:
  wazuh:
    manager_image: wazuh/wazuh-manager:4.14.10@sha256:eabfa7ee4e63acb51c2130fa0583e30f843d030b091cf45a4fbd93d78fa21517
    agent_deb:
      version: 4.14.10-1
      sha512: 5ee41846e81b2f5f5017bb0f968ac039443f09a400e5feb8121a4e52db6bb8d1c91683667b03a657a0236c858bd1f159026b493ace504ec8f92e491e6c8ae04d  # pragma: allowlist secret
    alert_level: 12
    off: [command_monitoring, sca, rootcheck, syscollector]
  watch:                           # every host with an agent
    logs:
      - {path: /var/log/auth.log, format: syslog}
      - {path: /var/log/snoopy.log, format: syslog}
      - {path: /var/log/dpkg.log, format: syslog}
    fim_realtime: [/etc, /home, /root, /tmp, /var/tmp]
rule_sets:                         # rule sets, each file pinned before use
  sigma:
    kind: sigma                    # Sigma rules, each given the events of its log source after the run
    repo: SigmaHQ/sigma
    commit: 552f3fee420ef232a8e5790c4fae591847e32347  # pragma: allowlist secret
    folders: [rules/linux/process_creation, rules/linux/file_event, rules/linux/builtin,
              rules/web/webserver_generic]
    licence: LICENSE
    lock: range-one.rules.lock     # sha256 of every fetched rule file and of the licence file
  et-open:
    kind: suricata
    source: lab/rules/et-open/SHA256SUMS
    sha256: [a7b140e3, 95557d19, a234b0fa, 465f4471, 39ba5071, 7ee6efcb, 0e23df6b, 7c6f30dc]
    version: "11342"
  aipt-sigma:
    kind: sigma
    repo: theori-io/aipt-detections
    commit: ["9e4653db", "4d9c9aaa", "64383543", "48953dbe", "89322848"]
    folders: [sigma]
    rule_paths: [sigma/correlation, sigma/file_event, sigma/network_connection,
                 sigma/process_creation, sigma/proxy, sigma/web, sigma/zeek]
    include: rules
    pipelines: [sigma/pipelines/aipt-placeholders.yaml]
    licence: LICENSE
    lock: range-one.rules.lock
  aipt-suricata:
    kind: suricata
    repo: theori-io/aipt-detections
    commit: ["9e4653db", "4d9c9aaa", "64383543", "48953dbe", "89322848"]
    folders: [suricata]
    include: rules
    exclude: [suricata/retired.rules]
    hash_files: [suricata/artex-ui-assets.md5]
    licence: LICENSE
    lock: range-one.rules.lock
  agentic-sigma:
    kind: sigma
    repo: ThreatDefence/agentic-attack-detections
    commit: ["12e37af3", "bcce482d", "0053e724", "1a31ba43", "a7ce0e64"]
    folders: [behaviors, general, frameworks]
    rule_paths: [behaviors/sigma, general/sigma, "frameworks/*/sigma"]
    include: rules
    licence: LICENSE
    lock: range-one.rules.lock
  agentic-suricata:
    kind: suricata
    repo: ThreatDefence/agentic-attack-detections
    commit: ["12e37af3", "bcce482d", "0053e724", "1a31ba43", "a7ce0e64"]
    folders: [behaviors, frameworks]
    rule_paths: [behaviors/suricata, "frameworks/*/suricata"]
    include: rules
    licence: LICENSE
    lock: range-one.rules.lock
  ordered-credential:
    kind: sigma
    source: lab/rules/linux/process_creation/ordered_credential_access/SHA256SUMS
    sha256: [d489218c, 3a2cd098, a23e04a7, 902f0a23, 53f2fca0, 2efd37cf, bda141a9, 5ce47b41]
    version: "1"
defenses:                          # each judges the same run; the first is the baseline
  - {id: wazuh-stock, name: Wazuh with its stock rules, sensors: [wazuh-agent], rules: [wazuh]}
  - {id: sigma-public, name: Public Sigma rules on host logs,
     sensors: [wazuh-agent], rules: [sigma]}
  - {id: packets-et-open, name: "Packets on web, judged by Suricata with the ET Open rules",
     sensors: [packet-capture], rules: [et-open]}
  - {id: ai-tool-packs, name: AI tool detection packs on host logs and packets,
     sensors: [wazuh-agent, packet-capture],
     rules: [aipt-sigma, aipt-suricata, agentic-sigma, agentic-suricata]}
  - {id: ordered-credential, name: Ordered credential activity on host logs,
     sensors: [wazuh-agent], rules: [ordered-credential]}
networks:                          # all: --internal, gateway_mode_ipv4=isolated, no IPv6
  edge: {}                         # the stand-in internet
  inside: {}                       # web, build, db
  mgmt: {}                         # agents to manager
hosts:
  attacker:
    kind: attacker
    role: attacker's machine on the internet
    networks: [edge]
    packages: [openssh-client, sshpass]
    atomics_src: [T1110.004]
    agent: false
  inet:
    kind: internet
    role: stand-in internet (file server and upload drop)
    networks: [edge]
    packages: [python3]
    services: [inet-server]
    listens: [80, 443]
    serve: {"/atomics/T1105/src/atomic.sh": "atomic:T1105/src/atomic.sh"}
    agent: false
  client:
    kind: host
    role: shop customers and the administrator's laptop
    networks: [edge]
    packages: [curl, openssh-client]
    accounts: [{name: ops, shell: /bin/bash}]
    keys: [{name: ops, type: ed25519, private: ops@client}]
    known_hosts: [{account: ops, hosts: [web]}]
    agent: false
  web:
    kind: host
    role: web application
    networks: [edge, inside, mgmt]
    packages: [nginx, php-fpm, php-mysql, curl, wget, procps, openssh-client, openssh-server, sudo, cron, tcpdump]
    capture: packets
    services: [sshd, nginx, php-fpm, cron]
    listens: [22, 80]
    sshd: {password_auth: true, permit_root: false, pam_nodelay: true}
    accounts:
      - {name: webadmin, password: webadmin, shell: /bin/bash,  # pragma: allowlist secret
         listed: {file: "atomic:T1110.004/src/credstuffuserpass.txt", line: 475}}
      - {name: ops, shell: /bin/bash, sudo: ["/usr/sbin/nginx -t"]}
    keys:
      - {name: deploy, type: rsa, private: webadmin@web, file: id_rsa, authorized: deploy@build}
      - {name: ops, authorized: ops@web}
    known_hosts: [{account: webadmin, hosts: [build], hashed: false}]
    dirs:
      - {path: /tmp/stage, owner: webadmin, mode: "0700"}        # staging folder for s08
    files:
      - {path: /var/www/app/config.php, owner: www-data, mode: "0644",
         text: "<?php $db_host='db'; $db_user='shop'; $db_password='Shop-Db-2026'; ?>"}  # pragma: allowlist secret
      - {path: /var/www/app/index.php, from: app/index.php}      # session_start(), one db query
      - {path: /var/www/app/cron.php, from: app/cron.php}        # writes /tmp/shop-cache-*.json, removes old ones
    watch: {logs: [{path: /var/log/nginx/access.log, format: apache},
                   {path: /var/log/nginx/error.log, format: syslog}],
            fim_realtime: [/var/www, /var/lib/php/sessions]}
  db:
    kind: host
    role: database
    networks: [inside, mgmt]
    packages: [mariadb-server, cron]
    services: [mariadb, cron]
    listens: [3306]
    database: {name: shop, user: shop, password: Shop-Db-2026, from: "%",  # pragma: allowlist secret
               bind_address: 0.0.0.0, log_error: /var/log/mysql/error.log, sql: app/shop.sql}
    watch: {logs: [{path: /var/log/mysql/error.log, format: syslog}]}   # mysql_log delivers none of MariaDB 10.11's lines
  build:
    kind: host
    role: build server
    networks: [inside, mgmt]
    packages: [git, make, openssh-server, cron]
    services: [sshd, cron]
    listens: [22]
    sshd: {password_auth: false, permit_root: false}
    accounts: [{name: deploy, shell: /bin/bash}, {name: ci, shell: /bin/bash}]
    files:
      - {path: /etc/buildbot/signing.env, owner: root, group: deploy, mode: "0640",
         text: "SIGNING_KEY=range-one-signing-secret-7f3a"}  # pragma: allowlist secret
      - {path: /srv/git/shop.git, from: repo:shop, owner: ci}
    watch: {fim_realtime: [/srv/git]}
  manager:
    kind: defense
    role: Wazuh manager
    networks: [mgmt]
    listens: [1514, 1515]
activity:                          # every job runs with BLUEFIRE_TAG=job:<name>, from the engine's go
  seed: 1
  warmup_seconds: 30
  tail_seconds: 15
  jobs:
    - {name: browse, host: client, account: ops, every: [5, 15], do: http, target: web,
       paths: [/, "/?item=1", "/?item=2", "/?item=3", /cart, /missing],
       writes: ["/var/lib/php/sessions/*"]}                      # each view keeps a PHP session
    - {name: admin, host: client, account: ops, every: [90, 150], do: ssh, target: ops@web,
       run: "uptime; df -h /; ls -l /var/www/app; sudo -n /usr/sbin/nginx -t"}
    - {name: cache, host: web, account: www-data, every: 60, do: cron,
       run: "php /var/www/app/cron.php", writes: ["/tmp/shop-cache-*.json"]}
    - {name: build, host: build, account: ci, every: 60, do: cron,
       run: "cd && { test -d shop || git clone -q /srv/git/shop.git shop; } && cd shop && git pull -q && make -s -B",
       writes: ["/home/ci/*"]}                                    # the clone in ci's home folder
    - {name: backup, host: db, account: root, every: 300, do: cron,
       run: "mariadb-dump shop > /var/backups/shop.sql", writes: ["/var/backups/*"]}
path:
  start: {host: attacker, note: "the attacker has only an address on the internet"}
  hand_off: "steps s02 to s10 run as webadmin on web through docker exec, not inside the SSH session of s01"
  goal:
    plain: "build's signing secret reaches inet"
    after: s10
    check: {upload: first, from: "{ip:web@edge}", contains: "tmp/stage/etc.tar.gz",
            inner: "buildbot/signing.env", equals: "build:/etc/buildbot/signing.env"}
  steps:
    - {id: s01, technique: T1110.004, guid: 4f08197a-2a8a-472d-9589-cd2895ef22ad,
       name: SSH Credential Stuffing From Linux, host: attacker, to: web, account: root, workdir: /tmp,
       plain: "From the attacker's machine, tries each user name and password of a published list on web's SSH server, and gets in as webadmin.",
       args: {target_host: web}, timeout: 600, cleanup: none,
       check: {host: web, run: "grep -q 'Accepted password for webadmin from {ip:attacker@edge} ' /var/log/auth.log"},
       expect: [5710, 5716, 5712, 5720, 5763, 5715, 5501, 40112]}
    - {id: s02, technique: T1105, guid: bdc373c5-e9cf-4563-8a7b-a9ba720a90f3,
       name: Linux Download File and Run, host: web, account: webadmin, workdir: /tmp,
       plain: "As webadmin on web, downloads a script from the stand-in internet and runs it.",
       args: {remote_url: "http://inet/atomics/T1105/src/atomic.sh", payload_name: atomic.sh},
       cleanup: after_check,
       check: {all: [{output_contains: "Hello From Atomic Red Team"},
                     {host: inet, run: "grep -q '^{ip:web@edge} GET /atomics/T1105/src/atomic.sh 200' /var/log/inet/access.log"}]},
       expect: [554]}
    - {id: s03, technique: T1082, guid: cccb070c-df86-4216-a5bc-9fb60c74e27c,
       name: List OS Information, host: web, account: webadmin, workdir: /tmp,
       plain: "Writes what web's system, kernel and release are into a file in /tmp.",
       args: {output_file: /tmp/T1082.txt}, cleanup: after_check,
       check: {host: web, run: "grep -q Linux /tmp/T1082.txt"}, expect: [554]}
    - {id: s04, technique: T1018, guid: 6fc814cb-16d1-43e6-80b3-2ff2a45250d1,
       name: Enumerate SSH Configuration, host: web, account: webadmin, workdir: /tmp,
       plain: "Looks for known_hosts files in webadmin's home folder and keeps what they hold, which names build.",
       args: {search_path: "/home/webadmin", filename: known_hosts, output_file: /tmp/ssh_enum.txt},
       cleanup: after_check,
       check: {host: web, run: "grep -q '^build ' /tmp/ssh_enum.txt"}, expect: [554]}
    - {id: s05a, technique: T1046, guid: 68e907da-2539-48f6-9fc9-257a78c05540,
       name: Port Scan, host: web, to: build, account: webadmin, workdir: /tmp, args: {host: build},
       plain: "From web, tries build's TCP ports one after another to find which of them listen.",
       timeout: 300, cleanup: none, check: {output_contains: "port 22 is open"}, expect: []}
    - {id: s05b, technique: T1046, guid: 68e907da-2539-48f6-9fc9-257a78c05540,
       name: Port Scan, host: web, to: db, account: webadmin, workdir: /tmp, args: {host: db},
       plain: "From web, tries db's TCP ports one after another to find which of them listen.",
       timeout: 300, cleanup: none, check: {output_contains: "port 3306 is open"}, expect: []}
    - {id: s06, technique: T1552.001, guid: bd4cf0d1-7646-474e-8610-78ccf5a097c4,
       name: Extract passwords with grep, host: web, account: webadmin, workdir: /tmp,
       plain: "Searches the shop's application folder for the word password, and finds the database's password.",
       args: {file_path: /var/www/app}, cleanup: none,
       check: {output_contains: "Shop-Db-2026"}, expect: []}
    - {id: s07, technique: T1552.004, guid: 46959285-906d-40fa-9437-5a439accd878,
       name: Discover Private SSH Keys, host: web, account: webadmin, workdir: /tmp,
       plain: "Looks for private SSH keys in webadmin's home folder and copies each one it finds into /tmp/creds.txt.",
       args: {search_path: "/home/webadmin", filename: id_rsa,
              optional_flags: "-exec sh -c 'echo \"=== $1 ===\" >> /tmp/creds.txt; cat \"$1\" >> /tmp/creds.txt' _ {} \\;"},
       cleanup: after_check,
       check: {host: web, run: "grep -q 'BEGIN OPENSSH PRIVATE KEY' /tmp/creds.txt"},  # pragma: allowlist secret
       expect: [554]}
    - {id: s08, technique: T1048, guid: f6786cc8-beda-4915-a4d6-ac2f193bb988,
       name: Exfiltration Over Alternative Protocol - SSH, host: web, to: build,
       account: webadmin, workdir: /tmp/stage, args: {domain: deploy@build}, cleanup: none,
       plain: "With the deploy key it found, logs in to build as deploy over SSH and copies build's /etc back as an archive.",
       check: {host: web, run: "tar -tzf /tmp/stage/etc.tar.gz | grep -qx 'buildbot/signing.env'"},
       expect: [5715, 5501, 554]}
    - {id: s09, technique: T1560.001, guid: 7af2b51e-ad1c-498c-aca8-d3290c19535a,
       name: Data Compressed - nix - tar Folder or File, host: web, account: webadmin, workdir: /tmp,
       plain: "Packs the staging folder, which now holds build's configuration, into one compressed archive.",
       args: {input_file_folder: /tmp/stage, output_file: /tmp/loot.tar.gz}, cleanup: after_path,
       check: {host: web, run: "tar -tzf /tmp/loot.tar.gz | grep -qx 'tmp/stage/etc.tar.gz'"},
       expect: [554]}
    - {id: s10, technique: T1048.002, guid: 7ccdfcfa-6707-46bc-b812-007ab6ff951c,
       name: Exfiltrate data in a file over HTTPS using wget, host: web, to: inet, account: webadmin,
       workdir: /tmp, args: {input_file: /tmp/loot.tar.gz, endpoint_domain: "https://inet/upload"},
       plain: "Uploads that archive to the stand-in internet over HTTPS with wget.",
       cleanup: none,
       check: {upload: first, from: "{ip:web@edge}", sha256_equals: "web:/tmp/loot.tar.gz"},
       expect: []}
