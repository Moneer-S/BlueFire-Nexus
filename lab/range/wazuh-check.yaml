# A range with its defense and nothing else: a Wazuh manager and one host with
# a Wazuh agent inside, on one internal network. It shows that what happens on
# the host reaches the manager: the run waits until the agent is connected and
# a nonce it logs on the host is in the manager's archive, then makes a few
# harmless marks on the host (lines sent to syslog, a file created and changed
# in a watched folder, a program start) and counts how many lines of each
# watched log reached the manager. No published test runs here.
#
# When the range with all seven hosts (lab/range/range-one.yaml) shows the same
# thing, this spec is deleted.
range: wazuh-check
version: 1
prefix: bluefire-lab-wz
docker: {min_engine: 28}
base:
  image: ubuntu:noble-20261110.1@sha256:882e1e56091c9ffbc70c026ff5935fe85d3c91ad155917865ba2ffa23ede1560
  apt_snapshot: "20261120T000000Z"
defense:
  wazuh:
    manager_image: wazuh/wazuh-manager:4.14.10@sha256:eabfa7ee4e63acb51c2130fa0583e30f843d030b091cf45a4fbd93d78fa21517
    agent_deb:
      version: 4.14.10-1
      sha512: 5ee41846e81b2f5f5017bb0f968ac039443f09a400e5feb8121a4e52db6bb8d1c91683667b03a657a0236c858bd1f159026b493ace504ec8f92e491e6c8ae04d  # pragma: allowlist secret
    # The level from which an alert counts when a step is scored. The manager keeps
    # its stock log_alert_level 3, so alerts.json also holds the matches below it.
    alert_level: 12
    off: [command_monitoring, sca, rootcheck, syscollector]
  watch:
    # auth.log and snoopy.log are required: the engine's nonces and marks are lines in them.
    logs:
      - {path: /var/log/auth.log, format: syslog}
      - {path: /var/log/snoopy.log, format: syslog}
      - {path: /var/log/dpkg.log, format: syslog}
    fim_realtime: [/etc, /home, /root, /tmp, /var/tmp]
networks:
  mgmt: {}
hosts:
  manager:
    kind: defense
    role: Wazuh manager
    networks: [mgmt]
    listens: [1514, 1515]
  web:
    kind: host
    role: a host with a Wazuh agent and an SSH server, which gives the seal a listener on it
    networks: [mgmt]
    packages: [openssh-server]
    services: [sshd]
    listens: [22]
